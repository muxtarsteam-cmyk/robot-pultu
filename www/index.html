<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap:;">
<title>Robot Pultu</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; --stop:#dc2626; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .app { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)); }
  h1 { font-size:17px; margin:0; text-align:center; }
  .card { background:var(--card); border-radius:14px; padding:10px; }
  .status { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  button { font:inherit; color:var(--text); border:0; border-radius:10px; background:#334155; padding:9px; font-size:14px; }
  button.primary { background:var(--accent); }
  button.voice { width:100%; font-size:15px; padding:11px; }
  button.voice.on { background:var(--ok); }
  button.voice.talk { background:var(--warn); color:#111; }
  button.voice.say { background:#8b5cf6; }
  .info { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-top:6px; gap:8px; }
  .info b { color:var(--text); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,50px); gap:6px; width:100%; max-width:270px; margin:0 auto; }
  .pad button { font-size:12px; font-weight:600; padding:2px; line-height:1.15; }
  .pad button.active { background:var(--accent); }
  #bF{grid-area:1/2} #bL{grid-area:2/1} #bS{grid-area:2/2;background:var(--stop)} #bR{grid-area:2/3} #bB{grid-area:3/2}
  #bS.active { background:#ff6b6b; }
  .note { font-size:12px; color:var(--warn); text-align:center; min-height:16px; }
  .note.err { background:#7f1d1d; color:#fff; border-radius:8px; padding:6px 8px; font-size:13px; }
  .sim { font-size:11px; color:var(--warn); text-align:center; }
  .row { display:flex; gap:6px; margin-top:6px; align-items:center; }
  .row input, .row select { flex:1; min-width:0; border:0; border-radius:8px; padding:8px; background:#0f172a; color:var(--text); font-size:14px; user-select:text; -webkit-user-select:text; }
  .row label { font-size:12px; color:var(--muted); flex:0 0 110px; }
  .row button { padding:8px 12px; }
  #botLine { margin-top:8px; font-size:13px; min-height:18px; color:#c4b5fd; }
  .camrow { display:flex; gap:8px; }
  .camwrap { position:relative; flex:0 0 128px; height:96px; background:#0f172a; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .camwrap video { width:100%; height:100%; object-fit:cover; display:none; }
  .camwrap span { font-size:11px; color:var(--muted); padding:4px; text-align:center; }
  .btns { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .btns button { font-size:12px; padding:6px 4px; }
  details summary { font-size:13px; color:var(--muted); cursor:pointer; }
  #picker { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px; }
  #picker .box { background:var(--card); border-radius:14px; padding:14px; width:100%; max-width:420px; max-height:80%; overflow:auto; }
  #picker button { width:100%; margin-top:8px; text-align:left; }
</style>
</head>
<body>
<div class="app">
  <h1>🤖 Robot Pultu <span id="ver" style="font-size:11px;color:var(--muted)">v10</span></h1>

  <div class="card">
    <div class="status">
      <span><span class="dot" id="dot"></span><span id="connText">Qoşulmayıb</span></span>
      <button class="primary" id="connBtn">Bluetooth-a Qoşul</button>
    </div>
    <div class="info"><span>Son komanda: <b id="lastCmd">—</b></span><span>Səs: <b id="lastVoice">—</b></span></div>
  </div>

  <div class="pad">
    <button id="bF" data-c="F">▲<br>İrəli</button>
    <button id="bL" data-c="L">◀<br>Sola</button>
    <button id="bS" data-c="S">■<br>Dayan</button>
    <button id="bR" data-c="R">▶<br>Sağa</button>
    <button id="bB" data-c="B">▼<br>Geri</button>
  </div>

  <div class="card">
    <button class="voice" id="voiceBtn">🎤 Səs idarəsi: Söndürülüb</button>
    <div class="row"><button id="ttsTest" style="flex:1">🔊 Səs testi</button></div>
    <div id="botLine"></div>
    <div class="row">
      <label for="nameInput">Robotun adı</label>
      <input id="nameInput" type="text" placeholder="Ziko" autocomplete="off">
      <button id="nameSave">Saxla</button>
    </div>
    <div class="row">
      <label for="keyInput">Gemini açarı</label>
      <input id="keyInput" type="password" placeholder="API açarı" autocomplete="off">
      <button id="keySave">Saxla</button>
    </div>
    <div class="info" style="justify-content:center" id="modeInfo">Açar yoxdur: telefonun səs tanıması istifadə olunur</div>
  </div>

  <div class="card">
    <div class="camrow">
      <div class="camwrap"><video id="cam" autoplay playsinline muted></video><span id="camHint">Kamera söndürülüb</span></div>
      <div class="btns">
        <button id="camBtn">📷 Kamera</button>
        <button id="lookBtn">👁 Nə görürsən?</button>
        <button id="doorBtn">🚪 Qapıya get</button>
        <button id="personBtn">🧍 Adama get</button>
        <button id="screenBtn">💻 Ekranı oxu</button>
        <button id="abortBtn" style="background:var(--stop)">⛔ Dayandır</button>
      </div>
    </div>
    <div class="info"><span id="missionLine">Tapşırıq yoxdur</span></div>
  </div>

  <details class="card">
    <summary>⚙ Ayarlar və tanınan şəxslər</summary>
    <div class="row"><label for="turnMs">Dönmə (ms)</label><input id="turnMs" type="number" min="100" max="2000" step="50"></div>
    <div class="row"><label for="fwdMs">İrəli addım (ms)</label><input id="fwdMs" type="number" min="100" max="3000" step="50"></div>
    <div class="row"><label for="circleSteps">Tam dövrə (addım)</label><input id="circleSteps" type="number" min="4" max="30" step="1"></div>
    <div class="row"><label for="camFacing">Kamera</label>
      <select id="camFacing"><option value="environment">Arxa kamera</option><option value="user">Ön kamera</option></select></div>
    <div class="row"><label for="ttsLang">Danışıq dili</label>
      <select id="ttsLang"><option value="auto">Avtomatik</option><option value="az-AZ">az-AZ</option><option value="tr-TR">tr-TR</option><option value="ru-RU">ru-RU</option><option value="en-US">en-US</option></select></div>
    <div class="row"><label for="ttsEngine">Səs mühərriki</label>
      <select id="ttsEngine"><option value="auto">Avtomatik (internet səsi əvvəl)</option><option value="device">Yalnız telefon səsi</option></select></div>
    <div class="row"><button id="setSave" class="primary" style="flex:1">Ayarları saxla</button></div>
    <div class="info"><span id="peopleInfo">Tanınan şəxs yoxdur</span><button id="peopleClear" style="padding:4px 8px;font-size:12px">Sil</button></div>
  </details>

  <div class="sim" id="simLine"></div>
  <div class="note" id="note"></div>
</div>

<div id="picker"><div class="box"><b>Cihaz seçin</b><div id="pickList"></div><button id="pickCancel" style="text-align:center;background:#475569">Ləğv et</button></div></div>

<script>window.onerror=function(m,s,l){var n=document.getElementById("note");if(n)n.textContent="JS xəta: "+m+" (sətir "+l+")";};</script>
<script src="cordova.js"></script>
<script>
(function () {
  var SPP = '00001101-0000-1000-8000-00805F9B34FB';
  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), connText = $('connText'), connBtn = $('connBtn');
  var lastCmd = $('lastCmd'), lastVoice = $('lastVoice'), noteEl = $('note'), voiceBtn = $('voiceBtn');
  var keyInput = $('keyInput'), keySave = $('keySave'), modeInfo = $('modeInfo');
  var nameInput = $('nameInput'), nameSave = $('nameSave'), botLine = $('botLine'), missionLine = $('missionLine');
  var video = $('cam'), camHint = $('camHint'), camBtn = $('camBtn');
  var NAMES = { F:'İrəli', B:'Geri', L:'Sola', R:'Sağa', S:'Dayan' };
  var note = function (t) { noteEl.textContent = t || ''; noteEl.className = 'note'; };
  var lastWarnSpoken = 0;
  // Xəta: ekranda qırmızı xəbərdarlıq + səslə məlumat
  function warn(msg, noSpeak) {
    msg = String(msg || 'Xəta');
    noteEl.textContent = '⚠ ' + msg; noteEl.className = 'note err';
    try { console.log('[Robot xəta] ' + msg); } catch (e) {}
    if (!noSpeak && Date.now() - lastWarnSpoken > 6000) { lastWarnSpoken = Date.now(); speak(msg.split('. ')[0].slice(0, 120)); }
  }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- Yadda saxlanan ayarlar ----------
  function sget(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var robotName = sget('robot_name', 'Ziko');
  var turnMs = +sget('turn_ms', 400), fwdMs = +sget('fwd_ms', 700), circleSteps = +sget('circle_steps', 12);
  var camFacing = sget('cam_facing', 'environment'), ttsLang = sget('tts_lang', 'auto'), ttsEngine = sget('tts_engine', 'auto');
  var people = [];
  try { people = JSON.parse(sget('people', '[]')) || []; } catch (e) { people = []; }
  var apiKey = sget('gemini_key', '');
  var goodModel = sget('gemini_model', '');

  nameInput.value = robotName;
  if (apiKey) keyInput.value = apiKey;
  $('turnMs').value = turnMs; $('fwdMs').value = fwdMs; $('circleSteps').value = circleSteps;
  $('camFacing').value = camFacing; $('ttsLang').value = ttsLang; $('ttsEngine').value = ttsEngine;

  function updateMode() {
    modeInfo.textContent = apiKey ? 'Gemini aktivdir' + (goodModel ? ' (' + goodModel + ')' : '') : 'Açar yoxdur: telefonun səs tanıması istifadə olunur';
  }
  function updatePeople() {
    $('peopleInfo').textContent = people.length ? 'Tanınanlar: ' + people.map(function (p) { return p.name; }).join(', ') : 'Tanınan şəxs yoxdur';
  }
  updateMode(); updatePeople();

  keySave.addEventListener('click', function () {
    apiKey = keyInput.value.trim(); sset('gemini_key', apiKey);
    updateMode(); note(apiKey ? 'Açar saxlanıldı' : 'Açar silindi');
    if (voiceOn) stopVoice();
  });
  nameSave.addEventListener('click', function () {
    var v = nameInput.value.trim();
    if (!v) { note('Ad boş ola bilməz'); return; }
    robotName = v; sset('robot_name', v); note('Robotun adı: ' + v);
  });
  $('setSave').addEventListener('click', function () {
    turnMs = Math.max(100, +$('turnMs').value || 400); fwdMs = Math.max(100, +$('fwdMs').value || 700);
    circleSteps = Math.max(4, +$('circleSteps').value || 12);
    camFacing = $('camFacing').value; ttsLang = $('ttsLang').value; ttsEngine = $('ttsEngine').value; onlineFails = 0; sset('tts_engine', ttsEngine);
    sset('turn_ms', turnMs); sset('fwd_ms', fwdMs); sset('circle_steps', circleSteps); sset('cam_facing', camFacing); sset('tts_lang', ttsLang);
    note('Ayarlar saxlanıldı');
    if (camStream) { stopCamera(); }
  });
  $('peopleClear').addEventListener('click', function () { people = []; sset('people', '[]'); updatePeople(); note('Tanınan şəxslər silindi'); });

  var BT = null, connected = false, devAddr = null, devName = '';
  var PERM_BT = ['android.permission.BLUETOOTH_CONNECT', 'android.permission.BLUETOOTH_SCAN', 'android.permission.ACCESS_FINE_LOCATION'];
  var PERM_MIC = 'android.permission.RECORD_AUDIO', PERM_CAM = 'android.permission.CAMERA';

  function setConnected(on, name) {
    connected = on;
    dot.classList.toggle('on', on);
    connText.textContent = on ? 'Qoşulub' + (name ? ': ' + name : '') : 'Qoşulmayıb';
    connBtn.textContent = on ? 'Ayır' : 'Bluetooth-a Qoşul';
    if (on) $('simLine').textContent = '';
  }

  function permPlugin() { return window.cordova && cordova.plugins && cordova.plugins.permissions; }
  function askPermissions(done) {
    var p = permPlugin();
    if (!p) return done();
    p.requestPermissions(PERM_BT.concat([PERM_MIC, PERM_CAM]), function () { done(); }, function () { done(); });
  }
  function permAsync(perm) {
    return new Promise(function (res) {
      var p = permPlugin();
      if (!p) return res(true);
      p.checkPermission(perm, function (s) {
        if (s && s.hasPermission) return res(true);
        p.requestPermission(perm, function (s2) { res(!!(s2 && s2.hasPermission)); }, function () { res(false); });
      }, function () { res(true); });
    });
  }

  // ---------- Bluetooth (HC-05 / HC-06, classic SPP) ----------
  function ensureEnabled(ok, fail) {
    BT.isEnabled(ok, function () { BT.enable(ok, function () { fail('Bluetooth açılmadı'); }); });
  }
  function showPicker(devices, cb) {
    var list = $('pickList'); list.innerHTML = '';
    devices.forEach(function (d) {
      var b = document.createElement('button');
      b.textContent = (d.name || 'Adsız') + '  (' + d.address + ')';
      b.onclick = function () { $('picker').style.display = 'none'; cb(d); };
      list.appendChild(b);
    });
    $('pickCancel').onclick = function () { $('picker').style.display = 'none'; note(''); };
    $('picker').style.display = 'flex';
  }
  function doConnect(d) {
    note('Qoşulur: ' + (d.name || d.address) + ' ...');
    BT.connect(d.address, [SPP], function () {
      devAddr = d.address; devName = d.name || d.address;
      setConnected(true, devName); note('');
    }, function (err) {
      var was = connected;
      setConnected(false); devAddr = null;
      if (was) abortMission();
      warn(was ? 'Bluetooth bağlantısı kəsildi' : 'Bluetooth qoşulmadı. Robotun işə düşdüyünü və cütləşdiyini yoxlayın.');
    });
  }
  function connect() {
    if (!BT) { warn('Bluetooth plugin tapılmadı. Simulyasiya rejimində işləyir.'); return; }
    askPermissions(function () {
      ensureEnabled(function () {
        BT.list(function (devices) {
          if (!devices || !devices.length) { warn('Cütləşdirilmiş cihaz yoxdur. Telefon ayarlarında HC-05 ilə cütləşin.'); return; }
          var hc = devices.filter(function (d) { return /hc-?0[56]/i.test(d.name || ''); });
          if (hc.length === 1) doConnect(hc[0]); else showPicker(devices, doConnect);
        }, function (e) { warn('Cihaz siyahısı alınmadı. Bluetooth icazəsini yoxlayın.'); });
      }, function (m) { warn(m || 'Bluetooth açılmadı'); });
    });
  }
  function disconnect() {
    abortMission();
    if (BT && devAddr) BT.disconnect(devAddr, SPP, function () {}, function () {});
    setConnected(false); devAddr = null;
  }
  connBtn.addEventListener('click', function () { connected ? disconnect() : connect(); });

  function send(c) {
    lastCmd.textContent = NAMES[c] + ' (' + c + ')';
    if (!connected || !BT) { $('simLine').textContent = 'Bluetooth qoşulmayıb, simulyasiya rejimində işləyir'; try { console.log('[SİM] komanda: ' + c); } catch (e) {} return; }
    BT.write(devAddr, SPP, c, function () {}, function () { warn('Robota göndərmə xətası. Bluetooth bağlantısını yoxlayın.'); });
  }

  // ---------- Düymələr (basılı saxla = hərəkət, burax = dayan) ----------
  document.querySelectorAll('.pad button').forEach(function (btn) {
    var c = btn.dataset.c;
    function down(e) { e.preventDefault(); if (mission) abortMission(); btn.classList.add('active'); send(c); if (navigator.vibrate) navigator.vibrate(15); }
    function up(e) { e.preventDefault(); if (btn.classList.contains('active')) { btn.classList.remove('active'); if (c !== 'S') send('S'); } }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // =====================================================================
  //  DANIŞIQ (TTS)
  // =====================================================================
  var ttsActive = false, ttsBusyUntil = 0, ttsUnlocked = false, ttsVoices = [], voiceWarned = false;
  function loadVoices() { try { ttsVoices = speechSynthesis.getVoices() || []; } catch (e) {} }
  if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
  // Brauzerin avtomatik səs bloku: ilk toxunuşda səs sintezini "oyadırıq"
  function unlockTTS() {
    if (ttsUnlocked) return;
    ttsUnlocked = true;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    loadVoices();
  }
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlockTTS, { passive: true }); });

  // Keyfiyyətli səsə üstünlük: "Google", "Natural", "Neural", şəbəkə səsləri
  function voiceScore(v) {
    var n = String(v.name || ''), sc = 0;
    if (/google|natural|neural|wavenet|enhanced|premium/i.test(n)) sc += 2;
    if (v.localService === false) sc += 1;
    return sc;
  }
  function findVoice(lang) {
    var l = lang.toLowerCase(), best = null, bs = -1, i, v, sc;
    for (i = 0; i < ttsVoices.length; i++) {
      v = ttsVoices[i];
      var vl = String(v.lang || '').replace('_', '-').toLowerCase();
      if (vl === l) sc = 10 + voiceScore(v); else if (vl.slice(0, 2) === l.slice(0, 2)) sc = 5 + voiceScore(v); else continue;
      if (sc > bs) { bs = sc; best = v; }
    }
    return best;
  }
  // Cihaz səsi: az-AZ varsa o, yoxdursa tr-TR (daha təbii), sonra istənilən mövcud səs
  function pickLang() {
    if (ttsLang !== 'auto') return ttsLang;
    if (findVoice('az-AZ')) return 'az-AZ';
    if (!voiceWarned) { voiceWarned = true; note('Telefonda Azərbaycan səsi yoxdur, türk səsi ilə danışacağam'); }
    return 'tr-TR';
  }

  // ---------- Mətn normallaşdırıcı (səsləndirməzdən əvvəl) ----------
  function normalizeSpeech(t, forTurkish) {
    t = String(t || '');
    t = t.replace(/```[\s\S]*?```/g, ' ').replace(/`([^`]*)`/g, '$1');
    t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');      // markdown şəkil/link
    t = t.replace(/https?:\/\/\S+|www\.\S+/gi, ' ');                                             // linklər
    t = t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2B00}-\u{2BFF}]/gu, ' '); // emoji
    t = t.replace(/^\s{0,3}#{1,6}\s*/gm, '').replace(/^\s*[-*•]\s+/gm, '').replace(/[*_~#>|^\\]+/g, ' '); // markdown
    t = t.replace(/(\d)\s*%/g, '$1 faiz').replace(/%/g, ' faiz ');
    t = t.replace(/(\d)\s*°\s*C?/g, '$1 dərəcə').replace(/\+/g, ' plus ').replace(/\s=\s|=/g, ' bərabərdir ').replace(/\s*&\s*/g, ' və ');
    t = t.replace(/(\d)\s*[x×*]\s*(\d)/g, '$1 vurulsun $2').replace(/(\d)\s*[\/÷]\s*(\d)/g, '$1 bölünsün $2');
    t = t.replace(/[()\[\]{}<>«»"“”„]/g, ', ').replace(/[;:]/g, ',').replace(/\.{2,}|…/g, '.').replace(/[-–—]+/g, ' ');
    t = t.replace(/\s*[\n\r]+\s*/g, '. ').replace(/([,.!?])\1+/g, '$1').replace(/,\s*([.!?])/g, '$1').replace(/[^\p{L}\p{N}\s,.!?]/gu, ' ');
    if (forTurkish) {                       // Türk sintezatoru Azərbaycan hərflərini səhv oxuyur
      t = t.replace(/ə/g, 'e').replace(/Ə/g, 'E')
           .replace(/x/g, 'h').replace(/X/g, 'H')
           .replace(/q/g, 'g').replace(/Q/g, 'G')
           .replace(/w/g, 'v').replace(/W/g, 'V');
    }
    return t.replace(/\s+/g, ' ').replace(/\s+([,.!?])/g, '$1').trim();
  }
  function splitChunks(t, max) {
    var out = [], parts = t.match(/[^.!?]+[.!?]?/g) || [t], cur = '';
    parts.forEach(function (p) {
      p = p.trim(); if (!p) return;
      while (p.length > max) {
        var cut = p.lastIndexOf(' ', max); if (cut < 20) cut = max;
        if (cur) { out.push(cur); cur = ''; }
        out.push(p.slice(0, cut).trim()); p = p.slice(cut).trim();
      }
      if ((cur + ' ' + p).trim().length > max) { if (cur) out.push(cur); cur = p; } else cur = (cur + ' ' + p).trim();
    });
    if (cur) out.push(cur);
    return out;
  }

  // ---------- Onlayn səs (Google Translate TTS, az) ----------
  var curAudio = null, speakToken = 0, onlineFails = 0;
  function stopSpeech() {
    speakToken++;
    var a = curAudio; curAudio = null;
    if (a) { try { a.pause(); } catch (e) {} try { a.onended && a.onended(); } catch (e) {} }
    try { speechSynthesis.cancel(); } catch (e) {}
    try { window.TTS && window.TTS.speak && window.TTS.speak({ text: '', locale: 'az-AZ' }, function () {}, function () {}); } catch (e) {}
  }
  // true = oxudu; false = heç başlamadı (cihaz səsinə keç)
  function playOnline(chunks, token) {
    return new Promise(function (resolve) {
      var i = 0, started = false, settled = false;
      function end(v) { if (settled) return; settled = true; resolve(v); }
      function fail() { onlineFails++; end(started); }
      function next() {
        if (token !== speakToken || i >= chunks.length) return end(true);
        var a = new Audio(), to;
        curAudio = a; a.preload = 'auto';
        a.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=az&q=' + encodeURIComponent(chunks[i]);
        to = setTimeout(function () { a.onerror = null; a.onended = null; try { a.pause(); } catch (e) {} fail(); }, 8000);
        a.onplaying = function () { started = true; onlineFails = 0; clearTimeout(to); };
        a.onended = function () { clearTimeout(to); i++; next(); };
        a.onerror = function () { clearTimeout(to); fail(); };
        var p = a.play();
        if (p && p.catch) p.catch(function () { clearTimeout(to); fail(); });
      }
      next();
    });
  }

  // ---------- Cihaz səsi (rate 0.95, pitch 1.0) ----------
  function speakDevice(text, lang) {
    return new Promise(function (resolve) {
      var done = false, plugin = window.TTS && typeof window.TTS.speak === 'function';
      var guard = setTimeout(fin, 4000 + text.length * 130);
      function fin() { if (done) return; done = true; clearTimeout(guard); resolve(); }
      function viaWeb() {
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
          if (!voiceWarned) { voiceWarned = true; note('Bu telefonda səs sintezi yoxdur. Cavab yalnız yazılı göstərilir.'); }
          setTimeout(fin, Math.min(3000, 600 + text.length * 40)); return;
        }
        try {
          loadVoices();
          try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch (e) {}
          var u = new SpeechSynthesisUtterance(text);
          u.lang = lang; u.volume = 1; u.rate = 0.95; u.pitch = 1.0;
          var v = findVoice(lang) || findVoice('tr-TR') || findVoice('az-AZ'); if (v) u.voice = v;
          u.onend = fin; u.onerror = fin;
          speechSynthesis.speak(u);
        } catch (e) { setTimeout(fin, 800); }
      }
      if (plugin) {
        try {
          window.TTS.speak({ text: text, locale: lang, rate: 0.95 }, fin, function () {
            if (lang !== 'tr-TR' && ttsLang === 'auto') {
              try { window.TTS.speak({ text: text, locale: 'tr-TR', rate: 0.95 }, fin, viaWeb); } catch (e) { viaWeb(); }
            } else viaWeb();
          });
        } catch (e) { viaWeb(); }
      } else viaWeb();
    });
  }

  async function speak(text) {
    text = String(text || '');
    botLine.textContent = '🤖 ' + text;
    stopSpeech();
    var token = speakToken;
    ttsActive = true; ttsBusyUntil = Date.now() + 90000;
    if (voiceOn) updateVoiceBtn('say');
    try {
      var played = false;
      if (ttsEngine === 'auto' && onlineFails < 3 && navigator.onLine !== false) {
        var clean = normalizeSpeech(text, false);
        if (clean) played = await playOnline(splitChunks(clean, 180), token);
      }
      if (!played && token === speakToken) {
        var lang = pickLang(), clean2 = normalizeSpeech(text, /^tr/i.test(lang));
        if (clean2) await speakDevice(clean2, lang);
      }
    } catch (e) {}
    if (token === speakToken) { ttsActive = false; ttsBusyUntil = Date.now() + 700; if (voiceOn) updateVoiceBtn(busy ? 'send' : 'idle'); }
  }
  $('ttsTest').addEventListener('click', function () { unlockTTS(); speak('Salam! Mən robotam, adım ' + robotName + '. Səsim eşidilir.'); });

  // =====================================================================
  //  GEMINI (mətn, səs, şəkil)
  // =====================================================================
  // Köhnə model yeni açarlara bağlıdır (404). Sıra ilə işləyəni tapır və yadda saxlayır.
  var MODELS = ['gemini-3.5-flash-lite', 'gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-flash-lite-latest', 'gemini-flash-latest', 'gemini-3.8-flash', 'gemini-2.5-flash'];

  function gUrl(model) { return 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(apiKey); }
  function gText(j) {
    try { return j.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('').trim(); } catch (e) { return ''; }
  }
  async function gemini(parts, opts) {
    opts = opts || {};
    if (!apiKey) throw new Error('Gemini açarı yoxdur');
    var list = goodModel ? [goodModel] : MODELS.slice(), lastStatus = 0, retry429 = 0, noJson = false;
    for (var i = 0; i < list.length; i++) {
      var body = { contents: [{ parts: parts }], generationConfig: { temperature: opts.temp == null ? 0 : opts.temp, maxOutputTokens: opts.maxTokens || 600 } };
      if (opts.json && !noJson) body.generationConfig.responseMimeType = 'application/json';
      var r;
      try { r = await fetch(gUrl(list[i]), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
      catch (e) { throw new Error('Şəbəkə xətası. İnternet var?'); }
      lastStatus = r.status;
      if (r.ok) {
        if (goodModel !== list[i]) { goodModel = list[i]; sset('gemini_model', goodModel); updateMode(); }
        return gText(await r.json());
      }
      if (r.status === 404 || r.status === 503) continue;                       // model yoxdur / məşğuldur
      if (r.status === 429 && retry429 < 3) { retry429++; note('Gemini limiti: gözləyirəm...'); await sleep(4000); i--; continue; }
      if (r.status === 400 && opts.json && !noJson) { noJson = true; i--; continue; }  // JSON rejimi dəstəklənmirsə
      throw new Error(r.status === 400 || r.status === 403 ? 'API açarı səhvdir və ya icazəsi yoxdur (' + r.status + ')'
                    : r.status === 429 ? 'Gemini limiti dolub, bir az gözləyin (429)' : 'Gemini xətası (' + r.status + ')');
    }
    if (goodModel) { goodModel = ''; try { localStorage.removeItem('gemini_model'); } catch (e) {} return gemini(parts, opts); }
    throw new Error('Heç bir Gemini modeli cavab vermədi (' + lastStatus + '). Açarı yoxlayın.');
  }
  function parseJSON(t) {
    if (!t) return null;
    t = String(t).replace(/```json|```/gi, '').trim();
    try { return JSON.parse(t); } catch (e) {}
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e2) {} }
    return null;
  }
  function imgPart(b64) { return { inline_data: { mime_type: 'image/jpeg', data: b64 } }; }
  function audioPart(b64) { return { inline_data: { mime_type: 'audio/wav', data: b64 } }; }

  // =====================================================================
  //  KAMERA
  // =====================================================================
  var camStream = null, cvs = document.createElement('canvas');
  async function startCamera() {
    if (camStream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { warn('Kamera bu mühitdə dəstəklənmir'); return false; }
    var ok = await permAsync(PERM_CAM);
    if (!ok) { warn('Kamera icazəsi yoxdur. Ayarlar, Tətbiqlər, Robot Pultu, İcazələr, Kamera.'); return false; }
    var gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    try { camStream = await gum({ video: { facingMode: { ideal: camFacing }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }); }
    catch (e) {
      try { camStream = await gum({ video: true, audio: false }); }
      catch (e2) { warn('Kamera açılmadı: ' + (e2 && e2.name ? e2.name : e2)); return false; }
    }
    video.srcObject = camStream;
    try { await video.play(); } catch (e) {}
    for (var i = 0; i < 40 && !video.videoWidth; i++) await sleep(100);
    video.style.display = 'block'; camHint.style.display = 'none'; camBtn.textContent = '📷 Bağla';
    await sleep(400);                                    // avtoparlaqlıq oturuşsun
    return !!video.videoWidth;
  }
  function stopCamera() {
    try { if (camStream) camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    camStream = null; video.srcObject = null; video.style.display = 'none'; camHint.style.display = ''; camBtn.textContent = '📷 Kamera';
  }
  function grabFrame(maxW, q) {
    maxW = maxW || 640; q = q || 0.7;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) throw new Error('Kameradan kadr gəlmir');
    var s = Math.min(1, maxW / vw);
    cvs.width = Math.round(vw * s); cvs.height = Math.round(vh * s);
    cvs.getContext('2d').drawImage(video, 0, 0, cvs.width, cvs.height);
    return cvs.toDataURL('image/jpeg', q).split(',')[1];
  }
  camBtn.addEventListener('click', function () { camStream ? stopCamera() : startCamera(); });

  var lastVision = 0, visionGap = 900;
  async function visionJSON(instruction, extraParts) {
    var d = visionGap - (Date.now() - lastVision);
    if (d > 0) await wait(d);
    lastVision = Date.now();
    var parts = [{ text: instruction }].concat(extraParts || []);
    parts.push({ text: 'Current frame:' }); parts.push(imgPart(grabFrame()));
    return parseJSON(await gemini(parts, { json: true, maxTokens: 700 })) || {};
  }

  // =====================================================================
  //  TAPŞIRIQ MOTORU (Dayan düyməsi / "dayan" səsi həmişə dayandırır)
  // =====================================================================
  var mission = null, replyWaiter = null;
  function setMissionLine(t) { missionLine.textContent = t || 'Tapşırıq yoxdur'; }
  function chk() { if (mission && mission.abort) throw { abort: true }; }
  async function wait(ms) { var end = Date.now() + ms; while (Date.now() < end) { chk(); await sleep(Math.max(1, Math.min(100, end - Date.now()))); } }
  async function moveFor(cmd, ms) { chk(); send(cmd); await wait(connected ? ms : Math.min(ms, 200)); send('S'); await wait(connected ? 450 : 100); }
  function abortMission() {
    if (replyWaiter) { clearTimeout(replyWaiter.t); var w = replyWaiter; replyWaiter = null; w.res(''); }
    if (mission) { mission.abort = true; stopSpeech(); ttsActive = false; }
    if (connected) send('S');
  }
  async function runMission(title, fn) {
    if (mission) { await speak('Əvvəlki tapşırıq davam edir. Dayan deyin.'); return; }
    mission = { title: title, abort: false }; setMissionLine('▶ ' + title);
    try { await fn(); }
    catch (e) { if (!(e && e.abort)) { warn(e && e.message ? e.message : 'Xəta oldu'); } else { setMissionLine('⛔ Dayandırıldı'); } }
    finally { if (connected) send('S'); mission = null; if (missionLine.textContent.indexOf('⛔') !== 0) setMissionLine(''); }
  }
  async function ensureReady(needMove) {
    if (!apiKey) { warn('Gemini açarı yoxdur. Açarı daxil edib Saxla düyməsinə basın.'); return false; }
    if (needMove && !connected) { $('simLine').textContent = 'Bluetooth qoşulmayıb, simulyasiya rejimində işləyir'; await speak('Bluetooth qoşulmayıb, simulyasiya rejimində işləyirəm.'); }
    if (!(await startCamera())) return false;
    return true;
  }

  // Hədəfi tap və ona yaxınlaş. true = çatdı, false = tapılmadı
  async function locate(target, refParts) {
    var r = await visionJSON(
      'TASK:LOCATE\nYou are the camera of a small wheeled robot. Target: "' + target + '".\n' +
      'Decide whether the target is visible in the current frame. Reply ONLY JSON: {"found":true|false,"position":"left|center|right","distance":"far|medium|close","note":"short"}.\n' +
      'position = horizontal position of the target (left third=left, middle third=center, right third=right). ' +
      'distance: close = target fills at least about 60% of the frame height or is closer than about 1 meter; medium = about 1-3 meters; far = farther than 3 meters or small in the frame. ' +
      'If you are not sure, found=false.', refParts);
    r.found = (r.found === true || r.found === 'true');
    return r;
  }
  async function seekAndApproach(target, refParts) {
    var spun = 0, explored = 0;
    for (var it = 0; it < 80; it++) {
      chk();
      var r = await locate(target, refParts);
      if (r.found) {
        setMissionLine('▶ ' + mission.title + ' — görürəm (' + (r.position || '?') + ', ' + (r.distance || '?') + ')');
        if (r.distance === 'close') return true;
        if (r.position === 'left') await moveFor('L', Math.round(turnMs * 0.5));
        else if (r.position === 'right') await moveFor('R', Math.round(turnMs * 0.5));
        else await moveFor('F', r.distance === 'medium' ? Math.round(fwdMs * 0.6) : fwdMs);
        spun = 0;
      } else {
        setMissionLine('▶ ' + mission.title + ' — axtarıram...');
        spun++;
        if (spun > circleSteps) {                           // tam dövrə bitdi: irəli keç və yenidən axtar
          explored++; spun = 0;
          if (explored > 2) return false;
          await moveFor('F', fwdMs * 2);
        } else await moveFor('R', turnMs);
      }
    }
    return false;
  }

  // ---------- Ssenari 1: Qapını tap ----------
  async function missionDoor() {
    if (!(await ensureReady(true))) return;
    await speak('Qapını axtarıram.');
    var ok = await seekAndApproach('a room door (door leaf or door frame)');
    await speak(ok ? 'Qapıya çatdım.' : 'Qapını tapa bilmədim.');
  }

  // ---------- Ssenari 2: Adamın yanına get ----------
  function norm(s) {
    return String(s || '').toLocaleLowerCase('az')
      .replace(/ə/g,'e').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ü/g,'u')
      .replace(/ğ/g,'g').replace(/ş/g,'s').replace(/ç/g,'c').replace(/[^a-z\s]/g,' ').replace(/\s+/g, ' ').trim();
  }
  function findPerson(name) {
    var n = norm(name);
    for (var i = 0; i < people.length; i++) { var pn = norm(people[i].name); if (pn === n || (pn.length > 2 && (n.indexOf(pn) === 0 || pn.indexOf(n) === 0))) return people[i]; }
    return null;
  }
  function cap(s) { return s ? s.charAt(0).toLocaleUpperCase('az') + s.slice(1) : s; }
  function personTarget(p) {
    return (p.gender && p.gender !== 'naməlum' ? p.gender + ', ' : '') + (p.clothes || '') + (p.phone ? ', holding a phone' : '');
  }
  function distinguisher(p, list) {
    var sameG = list.filter(function (q) { return q.gender === p.gender; });
    if (p.gender && p.gender !== 'naməlum' && sameG.length === 1) return p.gender + ' şəxs';
    var sameC = sameG.filter(function (q) { return norm(q.clothes) === norm(p.clothes); });
    if (p.clothes && sameC.length === 1) return p.clothes + ' şəxs';
    if (p.phone && sameG.filter(function (q) { return !!q.phone; }).length === 1) return 'telefonu əlində olan şəxs';
    return ({ left: 'soldakı', center: 'ortadakı', right: 'sağdakı' }[p.position] || 'bu') + ' şəxs';
  }

  function listenOnce(ms) {
    return new Promise(function (res) {
      var t = setTimeout(function () { replyWaiter = null; res(''); }, ms);
      replyWaiter = { res: res, t: t };
    });
  }
  async function askUser(q) {
    await speak(q);
    chk();
    if (voiceOn) updateVoiceBtn('idle');
    return await listenOnce(12000);
  }

  async function scanForPeople() {
    var spun = 0;
    for (;;) {
      chk();
      var r = await visionJSON(
        'TASK:PEOPLE\nList all real people visible in the current frame (ignore posters, photos and reflections). Reply ONLY JSON: ' +
        '{"people":[{"gender":"kişi|qadın|naməlum","clothes":"short Azerbaijani phrase like \'qırmızı köynəkli\'","phone":true|false,"position":"left|center|right"}]}. ' +
        'phone=true only if the person holds a phone in the hand.');
      var list = (r.people || []).filter(Boolean);
      if (list.length) return list;
      spun++;
      if (spun > circleSteps) return null;
      setMissionLine('▶ ' + mission.title + ' — adam axtarıram...');
      await moveFor('R', turnMs);
    }
  }

  async function choosePerson(list) {
    if (list.length === 1) return personTarget(list[0]);
    var n = list.length, ds = list.map(function (p) { return distinguisher(p, list); });
    var q;
    var genders = list.map(function (p) { return p.gender; });
    if (n === 2 && genders.indexOf('qadın') >= 0 && genders.indexOf('kişi') >= 0) {
      q = 'Otaqda iki nəfər var, kimin yanına yaxınlaşım? Qadın yoxsa kişi?';
    } else {
      var allSame = genders.every(function (g) { return g === genders[0] && g !== 'naməlum'; });
      q = 'Otaqda ' + (n === 2 ? 'iki' : n) + ' nəfər var' + (allSame ? ', hamısı ' + (genders[0] === 'qadın' ? 'qadındır' : 'kişidir') : '') + '. Kimin yanına yaxınlaşım? ' +
          ds.map(function (d, i) { return (i === 0 ? cap(d) : d) + 'in yanına'; }).join(', yoxsa ') + '?';
    }
    for (var attempt = 0; attempt < 2; attempt++) {
      var reply = await askUser(q);
      chk();
      if (!reply) { q = 'Cavabı eşitmədim. ' + q; continue; }
      var opts = list.map(function (p, i) { return (i + 1) + ') ' + ds[i] + ' (' + (p.gender || '') + ', ' + (p.clothes || '') + ')'; }).join('; ');
      var c = parseJSON(await gemini([{ text: 'TASK:CHOICE\nThe robot asked the user: "' + q + '"\nOptions: ' + opts + '\nThe user replied: "' + reply + '"\n' +
        'Which option did the user choose? Reply ONLY JSON: {"choice": number from 1 to ' + n + ', or 0 if unclear}' }], { json: true, maxTokens: 100 })) || {};
      var k = parseInt(c.choice, 10);
      if (k >= 1 && k <= n) return personTarget(list[k - 1]);
      q = 'Başa düşmədim. ' + q;
    }
    return null;
  }

  async function missionPerson(name) {
    if (!(await ensureReady(true))) return;
    if (name) {
      var p = findPerson(name);
      if (!p) { await speak(name + ' adlı şəxsi tanımıram. Əvvəlcə mənə "Mənim adım ' + name + '" deyin.'); return; }
      await speak(p.name + 'i axtarıram.');
      var refs = [{ text: 'Reference photos of the person to find (' + p.name + '). Description: ' + p.desc + '. Find a person in the current frame who matches these reference photos / description by appearance (clothing, hair, glasses, build).' }]
        .concat((p.imgs || []).map(imgPart));
      var ok = await seekAndApproach('the person named ' + p.name + ' (' + p.desc + ')', refs);
      await speak(ok ? p.name + ', yanınızdayam.' : p.name + 'i tapa bilmədim.');
      return;
    }
    await speak('Adamı axtarıram.');

    var ok2 = await seekAndApproach('a person: ' + target);
    await speak(ok2 ? 'Yanınızdayam.' : 'Yaxınlaşa bilmədim.');
  }

  // ---------- Tanış olmaq: üzü və adı yadda saxla ----------
  async function introduce(name) {

    if (!(await startCamera())) return;
    await speak(name + ', çox şadam! Mənə baxın, sizi yadda saxlayıram.');
    for (var a = 0; a < 3; a++) {
      await sleep(1200);
      var r = await visionJSON('TASK:INTRO\nHow many people are in the frame? If exactly one, describe them briefly in Azerbaijani (hair, glasses, beard, clothing) so they can be recognized later. Reply ONLY JSON: {"count":n,"desc":"..."}');
      var cnt = parseInt(r.count, 10);
      if (cnt === 1) {
        var imgs = [grabFrame(320, 0.6)];
        await sleep(700); try { imgs.push(grabFrame(320, 0.6)); } catch (e) {}
        var ex = findPerson(name);
        var rec = { name: name, desc: r.desc || '', imgs: imgs, ts: Date.now() };

  // ---------- Ətrafa bax ----------

    if (!(await startCamera())) return;
    var t = await gemini([{ text: 'TASK:DESCRIBE\nYou are the eye of a small robot. ' + (question ? 'The user asked: "' + question + '". Answer it.' : 'Say what you see in front of you.') +
      ' Reply in Azerbaijani, at most 2 short sentences, plain text, no markdown, no emoji.' }, { text: 'Frame:' }, imgPart(grabFrame())], { maxTokens: 300 });

  // =====================================================================
  //  SƏS: Gemini ilə dinləmə + çağırış (wake word) + marşrutlaşdırma
  // =====================================================================
  var voiceOn = false, activeUntil = 0;
  function updateVoiceBtn(state) {
    voiceBtn.classList.toggle('on', voiceOn);
    voiceBtn.classList.toggle('talk', voiceOn && state === 'talk');
    voiceBtn.classList.toggle('say', voiceOn && state === 'say');
    if (!voiceOn) voiceBtn.textContent = '🎤 Səs idarəsi: Söndürülüb';
    else if (state === 'talk') voiceBtn.textContent = '🗣 Eşidirəm...';
    else if (state === 'send') voiceBtn.textContent = '⏳ Gemini düşünür...';
    else if (state === 'say') voiceBtn.textContent = '🔊 ' + robotName + ' danışır...';
    else voiceBtn.textContent = '🎤 Dinləyir: "' + robotName + '" deyin (dayandırmaq üçün bas)';
  }

  var ctx = null, stream = null, srcNode = null, proc = null;
  var preRoll = [], speech = [], speaking = false, silenceMs = 0, speechMs = 0;
  var noise = 0.008, busy = 0, curRate = 16000;

  function downsample(buf, inRate, outRate) {
    if (inRate === outRate) return buf;
    var ratio = inRate / outRate, len = Math.floor(buf.length / ratio), out = new Float32Array(len);
    for (var i = 0; i < len; i++) {
      var pos = i * ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, buf.length - 1), f = pos - i0;
      out[i] = buf[i0] * (1 - f) + buf[i1] * f;
    }
    return out;
  }
  function concat(chunks) {
    var n = 0, i; for (i = 0; i < chunks.length; i++) n += chunks[i].length;
    var out = new Float32Array(n), o = 0;
    for (i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
    return out;
  }
  function toWav(samples, rate) {
    var buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (var i = 0; i < samples.length; i++) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }
  function blobToBase64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  function routerPrompt(active) {
    return 'TASK:ROUTER\nYou are the voice router of a small wheeled robot named "' + robotName + '". The audio contains ONE spoken utterance (Azerbaijani, sometimes Turkish or Russian). ' +
      'Words that sound similar to "' + robotName + '" count as calling the robot.\n' +
      'Session active (the user addressed the robot within the last 15 seconds): ' + (active ? 'true' : 'false') + '.\n' +
      'Reply ONLY JSON: {"heard":"transcript","called":true|false,"intent":"...","drive":"F|B|L|R|S|null","name":null|"...","question":null|"...","answer":null|"..."}\n' +
      'intent values:\n' +
      '- "stop": stop / dayan / dayandır / saxla.\n' +
      '- "drive": plain movement: irəli, qabağa (F); geri, arxaya (B); sola, sola dön (L); sağa, sağa dön (R). Set "drive". This works even without the robot name.\n' +
      '- "call": only the robot\'s name was said, with nothing else to do (e.g. "' + robotName + '", "' + robotName + ' bura gəl").\n' +
      '- "find_door": e.g. "qapıya yaxınlaş", "qapını tap".\n' +
      '- "go_person": e.g. "gördüyün adamın yanına get", "Əlinin yanına get". If a specific person is named, put the BASE form of the name in "name" (Əlinin -> Əli), otherwise name=null.\n' +
      '- "read_screen": e.g. "kompüterə yaxınlaş, ekrandakı sualı oxu və düzgün cavabı söylə".\n' +
      '- "introduce": the user says their own name ("Mənim adım Əlidi", "Mən Leylayam"): put the base form of the name in "name".\n' +
      '- "look": the user asks what the robot sees / to look around / asks about something visible ("nə görürsən?", "bu nədir?"). Put the question in "question" or null.\n' +
      '- "ask": any other question or request for conversation addressed to the robot. Answer it yourself in Azerbaijani, at most 2 short sentences, plain text without markdown or emoji, and put it in "answer".\n' +
      '- "none": noise, silence, or speech not addressed to the robot.\n' +
      'Rules: "called" is true if the robot\'s name is heard anywhere in the utterance. Except for "stop" and "drive", an utterance counts only if called is true or the session is active; otherwise use intent "none".';
  }

  async function transcribe(wav) {
    var b64 = await blobToBase64(wav);
    var t = await gemini([{ text: 'TASK:TRANSCRIBE\nWrite down exactly what is said in this audio (Azerbaijani). Output only the text.' }, audioPart(b64)], { maxTokens: 150 });
    return t.trim();
  }

  async function routeUtterance(wav) {
    var b64 = await blobToBase64(wav);
    var active = Date.now() < activeUntil;
    var t = await gemini([{ text: routerPrompt(active) }, audioPart(b64)], { json: true, maxTokens: 500 });
    var r = parseJSON(t);
    if (!r) { lastVoice.textContent = String(t).slice(0, 24) || '—'; return; }
    lastVoice.textContent = String(r.heard || '—').slice(0, 40);
    var intent = r.intent || 'none', needName = !(intent === 'stop' || intent === 'drive');
    if (needName && !(r.called || active)) return;
    if (mission && intent !== 'stop' && !(intent === 'drive' && r.drive === 'S')) return;   // tapşırıq gedir
    if (needName) activeUntil = Date.now() + 15000;

    switch (intent) {
      case 'stop': abortMission(); send('S'); note(''); break;
      case 'drive':
        if (/^[FBLRS]$/.test(r.drive || '')) { abortMission(); send(r.drive); note(''); }
        break;
      case 'call': await speak('Bəli, necə köməklik edə bilərəm?'); break;
      case 'ask': if (r.answer) await speak(String(r.answer)); break;
      case 'look': await describeView(r.question || ''); break;
      case 'introduce': await runMission('Tanışlıq', function () { return introduce(r.name); }); break;
      case 'find_door': await runMission('Qapını tap', missionDoor); break;
      case 'go_person': await runMission('Adamın yanına get', function () { return missionPerson(r.name || null); }); break;
      case 'read_screen': await runMission('Ekrandakı sualı oxu', missionScreen); break;
      default: break;
    }
  }

  function handleUtterance(chunks) {
    var pcm = downsample(concat(chunks), curRate, 16000);
    if (pcm.length < 16000 * 0.25) return;                // çox qısa səs-küy
    var wav = toWav(pcm, 16000);
    if (replyWaiter) {                                    // robot sual verib, cavab gözləyir
      var w = replyWaiter; replyWaiter = null; clearTimeout(w.t);
      busy++; updateVoiceBtn('send');
      transcribe(wav).catch(function () { return ''; }).then(function (txt) { lastVoice.textContent = txt.slice(0, 40) || '—'; busy--; w.res(txt); });
      return;
    }
    busy++; updateVoiceBtn('send');
    routeUtterance(wav).catch(function (e) {
      warn(e && e.message ? e.message : 'Şəbəkə xətası. İnternet var?');
    }).then(function () { busy--; if (voiceOn && !ttsActive) updateVoiceBtn(busy ? 'send' : 'idle'); });
  }

  function onAudio(e) {
    if (!voiceOn || !ctx) return;
    processChunk(new Float32Array(e.inputBuffer.getChannelData(0)), ctx.sampleRate);
  }
  function processChunk(chunk, rate) {
    if (!voiceOn) return;
    if (ttsActive || Date.now() < ttsBusyUntil) { speaking = false; speech = []; preRoll = []; return; }   // robot öz səsini eşitməsin
    curRate = rate;
    var sum = 0, i; for (i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
    var rms = Math.sqrt(sum / chunk.length), ms = chunk.length / rate * 1000;
    var thr = Math.max(0.025, noise * 3.5);
    if (!speaking) {
      noise = noise * 0.97 + rms * 0.03;
      preRoll.push(chunk); if (preRoll.length > 8) preRoll.shift();
      if (rms > thr) { speaking = true; speech = preRoll.slice(); preRoll = []; silenceMs = 0; speechMs = 0; updateVoiceBtn('talk'); }
    } else {
      speech.push(chunk); speechMs += ms;
      if (rms > thr) silenceMs = 0; else silenceMs += ms;
      if (silenceMs > 650 || speechMs > 6000) {
        speaking = false;
        var s = speech; speech = []; silenceMs = 0;
        updateVoiceBtn(busy ? 'send' : 'idle');
        handleUtterance(s);
      }
    }
  }

  function micPermission(cb) { permAsync(PERM_MIC).then(cb); }

  // ---- Mikrofon: WebView getUserMedia (MODIFY_AUDIO_SETTINGS icazəsi ilə) ----
  function startGemini() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { warn('Mikrofon bu mühitdə dəstəklənmir'); return; }
    micPermission(function (ok) {
      if (!ok) { warn('Mikrofon icazəsi yoxdur. Ayarlar, Tətbiqlər, Robot Pultu, İcazələr, Mikrofon.'); return; }
      var gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices), tries = 0;
      function attempt() {
        tries++;
        var c = (tries % 2) ? { audio: true } : { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
        return gum(c).catch(function (e) {
          if (tries >= 4) throw e;
          note('Mikrofon cəhdi ' + tries + '/4 ...');
          return sleep(900).then(attempt);
        });
      }
      note('Mikrofon açılır...');
      attempt().then(function (st) {
        stream = st;
        var AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        srcNode = ctx.createMediaStreamSource(stream);
        proc = ctx.createScriptProcessor(2048, 1, 1);
        proc.onaudioprocess = onAudio;
        srcNode.connect(proc); proc.connect(ctx.destination);
        preRoll = []; speech = []; speaking = false; noise = 0.008;
        voiceOn = true; updateVoiceBtn('idle'); note('');
      }).catch(function (e) {
        warn('Mikrofon açılmadı: ' + (e && e.name ? e.name : e) + '. İcazələri yoxlayın.');
      });
    });
  }
  function stopGemini() {
    try { if (proc) { proc.onaudioprocess = null; proc.disconnect(); } } catch (e) {}
    try { if (srcNode) srcNode.disconnect(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (ctx) ctx.close(); } catch (e) {}
    proc = srcNode = stream = ctx = null; speaking = false; speech = []; preRoll = [];
  }

  // ---------- Ehtiyat: telefonun səs tanıması (yalnız hərəkət komandaları) ----------
  var LANG = 'az-AZ', errCount = 0;
  var RULES = [
    ['S', ['dayandir', 'dayan', 'stop', 'sakit']],
    ['F', ['ireli', 'qabaga', 'qabag']],
    ['B', ['geri', 'arxaya', 'arxa']],
    ['L', ['sola', 'sol']],
    ['R', ['saga', 'sag']]
  ];
  function parseVoice(text) {
    var words = norm(text).split(/\s+/).filter(Boolean);
    for (var i = words.length - 1; i >= 0; i--)
      for (var r = 0; r < RULES.length; r++)
        if (RULES[r][1].indexOf(words[i]) !== -1) return RULES[r][0];
    return null;
  }
  function handleMatches(matches) {
    var cmd = null, heard = '';
    for (var i = 0; i < matches.length && !cmd; i++) { cmd = parseVoice(matches[i]); if (cmd) heard = matches[i]; }
    if (!heard && matches.length) heard = matches[0];
    lastVoice.textContent = heard || '—';
    if (cmd) send(cmd);
  }
  function listenLoop() {
    if (!voiceOn || apiKey) return;
    var sr = window.plugins && window.plugins.speechRecognition;
    if (!sr) { note('Səs tanıma plugin-i tapılmadı'); voiceOn = false; updateVoiceBtn(); return; }
    sr.startListening(function (matches) {
      errCount = 0; handleMatches(matches || []); setTimeout(listenLoop, 200);
    }, function () {
      errCount++;
      if (errCount >= 4 && LANG === 'az-AZ') { LANG = 'tr-TR'; errCount = 0; note('az-AZ dəstəklənmir, tr-TR ilə davam edir'); }
      setTimeout(listenLoop, 500);
    }, { language: LANG, matches: 5, showPopup: false, showPartial: false });
  }
  function startNative() {
    var sr = window.plugins && window.plugins.speechRecognition;
    if (!sr) { note('Səs tanıma plugin-i tapılmadı'); return; }
    sr.requestPermission(function () {
      voiceOn = true; errCount = 0; updateVoiceBtn('idle'); note(''); listenLoop();
    }, function () { note('Mikrofon icazəsi verilməyib'); });
  }

  // ---------- Ümumi düymələr ----------
  function startVoice() { unlockTTS(); apiKey ? startGemini() : startNative(); }
  function stopVoice() {
    voiceOn = false; updateVoiceBtn();
    stopGemini();
    try { window.plugins.speechRecognition.stopListening(function () {}, function () {}); } catch (e) {}
  }
  voiceBtn.addEventListener('click', function () { voiceOn ? stopVoice() : startVoice(); });

  function guarded(fn) { return function () { fn().catch(function (e) { if (!(e && e.abort)) warn(e && e.message ? e.message : 'Xəta'); }); }; }
  $('lookBtn').addEventListener('click', guarded(function () { return describeView(''); }));
  $('doorBtn').addEventListener('click', guarded(function () { return runMission('Qapını tap', missionDoor); }));
  $('personBtn').addEventListener('click', guarded(function () { return runMission('Adamın yanına get', function () { return missionPerson(null); }); }));
  $('screenBtn').addEventListener('click', guarded(function () { return runMission('Ekrandakı sualı oxu', missionScreen); }));
  $('abortBtn').addEventListener('click', function () { abortMission(); send('S'); });

  // ---------- Başlanğıc ----------
  document.addEventListener('deviceready', function () {
    BT = window.bluetoothClassicSerial || null;
    if (!BT) { $('simLine').textContent = 'Bluetooth qoşulmayıb, simulyasiya rejimində işləyir'; }
    askPermissions(function () {});
  }, false);
  document.addEventListener('pause', function () { abortMission(); if (connected) send('S'); if (voiceOn) stopVoice(); stopCamera(); }, false);

  setTimeout(function () {
    if (!window.cordova) note('Bu fayl yalnız qurulmuş APK daxilində Bluetooth ilə işləyir.');
  }, 1500);

  // yoxlama üçün (testlər): istifadəçi interfeysinə təsir etmir
  window.__robotTest = {
    route: function () { return routeUtterance(new Blob([new Uint8Array(100)], { type: 'audio/wav' })); },
    handleUtterance: function () { handleUtterance([new Float32Array(16000)]); },
    setBT: function (b) { BT = b; }, setVisionGap: function (g) { visionGap = g; },
    setTiming: function (t, f) { turnMs = t; fwdMs = f; }, setActive: function () { activeUntil = Date.now() + 15000; },
    ttsTest: function () { return speak('Test'); }, norm: normalizeSpeech, split: splitChunks, state: function () { return { connected: connected, mission: mission && mission.title, people: people, active: activeUntil }; }
  };
  var ver = document.getElementById('ver'); if (ver) ver.textContent = 'v10 ✓';
})();
</script>
</body>
</html>
