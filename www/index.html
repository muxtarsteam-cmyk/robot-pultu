<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap:;">
<title>Robot Pultu</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; --stop:#dc2626; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .app { max-width:480px; margin:0 auto; height:100%; display:flex; flex-direction:column; gap:12px; padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); }
  h1 { font-size:18px; margin:0; text-align:center; }
  .card { background:var(--card); border-radius:14px; padding:12px; }
  .status { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  button { font:inherit; color:var(--text); border:0; border-radius:12px; background:#334155; padding:12px; font-size:16px; }
  button.primary { background:var(--accent); }
  button.voice.on { background:var(--ok); }
  .info { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; margin-top:8px; gap:8px; }
  .info b { color:var(--text); }
  .pad { flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px; min-height:230px; }
  .pad button { font-size:17px; font-weight:600; }
  .pad button.active { background:var(--accent); }
  #bF{grid-area:1/2} #bL{grid-area:2/1} #bS{grid-area:2/2;background:var(--stop)} #bR{grid-area:2/3} #bB{grid-area:3/2}
  #bS.active { background:#ff6b6b; }
  .note { font-size:12px; color:var(--muted); text-align:center; min-height:30px; }
  #picker { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px; }
  #picker .box { background:var(--card); border-radius:14px; padding:14px; width:100%; max-width:420px; max-height:80%; overflow:auto; }
  #picker button { width:100%; margin-top:8px; text-align:left; }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px; }
  #settings .box { background:var(--card); border-radius:14px; padding:14px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; }
  #settings input[type=password], #settings input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:var(--text); font-size:15px; user-select:text; -webkit-user-select:text; }
  #settings label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .row { display:flex; gap:8px; } .row button { flex:1; }
  .ai { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="app">
  <h1>🤖 Robot Pultu</h1>

  <div class="card">
    <div class="status">
      <span><span class="dot" id="dot"></span><span id="connText">Qoşulmayıb</span></span>
      <button class="primary" id="connBtn">Bluetooth-a Qoşul</button>
    </div>
    <div class="info"><span>Son komanda: <b id="lastCmd">—</b></span><span>Səs: <b id="lastVoice">—</b></span></div>
  </div>

  <div class="pad">
    <button id="bF" data-c="F">▲<br>İrəli</button>
    <button id="bL" data-c="L">◀<br>Sola</button>
    <button id="bS" data-c="S">■<br>Dayan</button>
    <button id="bR" data-c="R">▶<br>Sağa</button>
    <button id="bB" data-c="B">▼<br>Geri</button>
  </div>

  <div class="card">
    <button class="voice" id="voiceBtn" style="width:100%">🎤 Səs idarəsi: Söndürülüb</button>
    <div class="info" style="justify-content:center">irəli · geri · sola · sağa · dayan</div>
    <div class="info" style="justify-content:space-between;align-items:center">
      <span id="aiState">🤖 Gemini: söndürülüb</span>
      <button id="setBtn" style="padding:6px 12px;font-size:13px">⚙ Gemini ayarları</button>
    </div>
  </div>
  <div class="note" id="note"></div>
</div>

<div id="settings"><div class="box">
  <b>Gemini API ayarları</b>
  <input type="password" id="keyInput" placeholder="Gemini API açarı (AIza...)" autocomplete="off">
  <input type="text" id="modelInput" placeholder="Model (məs: gemini-2.5-flash-lite)">
  <label><input type="checkbox" id="aiOn"> Səs əmrlərini Gemini ilə təhlil et</label>
  <div class="ai">Açarı <b>aistudio.google.com/apikey</b> ünvanından pulsuz ala bilərsiniz. Açar yalnız bu telefonda saxlanılır.</div>
  <div class="row"><button id="aiTest">Yoxla</button><button class="primary" id="aiSave">Yadda saxla</button></div>
  <button id="aiClose" style="background:#475569">Bağla</button>
</div></div>

<div id="picker"><div class="box"><b>Cihaz seçin</b><div id="pickList"></div><button id="pickCancel" style="text-align:center;background:#475569">Ləğv et</button></div></div>

<script src="cordova.js"></script>
<script>
(function () {
  var SPP = '00001101-0000-1000-8000-00805F9B34FB';
  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), connText = $('connText'), connBtn = $('connBtn');
  var lastCmd = $('lastCmd'), lastVoice = $('lastVoice'), noteEl = $('note'), voiceBtn = $('voiceBtn');
  var NAMES = { F:'İrəli', B:'Geri', L:'Sola', R:'Sağa', S:'Dayan' };
  var note = function (t) { noteEl.textContent = t || ''; };

  var BT = null, connected = false, devAddr = null, devName = '';
  var PERMS = [
    'android.permission.BLUETOOTH_CONNECT',
    'android.permission.BLUETOOTH_SCAN',
    'android.permission.ACCESS_FINE_LOCATION',
    'android.permission.RECORD_AUDIO'
  ];

  function setConnected(on, name) {
    connected = on;
    dot.classList.toggle('on', on);
    connText.textContent = on ? 'Qoşulub' + (name ? ': ' + name : '') : 'Qoşulmayıb';
    connBtn.textContent = on ? 'Ayır' : 'Bluetooth-a Qoşul';
  }

  function askPermissions(done) {
    var p = window.cordova && cordova.plugins && cordova.plugins.permissions;
    if (!p) return done();
    p.requestPermissions(PERMS, function () { done(); }, function () { done(); });
  }

  // ---------- Bluetooth (HC-05 / HC-06, classic SPP) ----------
  function ensureEnabled(ok, fail) {
    BT.isEnabled(ok, function () { BT.enable(ok, function () { fail('Bluetooth açılmadı'); }); });
  }

  function showPicker(devices, cb) {
    var list = $('pickList'); list.innerHTML = '';
    devices.forEach(function (d) {
      var b = document.createElement('button');
      b.textContent = (d.name || 'Adsız') + '  (' + d.address + ')';
      b.onclick = function () { $('picker').style.display = 'none'; cb(d); };
      list.appendChild(b);
    });
    $('pickCancel').onclick = function () { $('picker').style.display = 'none'; note(''); };
    $('picker').style.display = 'flex';
  }

  function doConnect(d) {
    note('Qoşulur: ' + (d.name || d.address) + ' ...');
    BT.connect(d.address, [SPP], function () {
      devAddr = d.address; devName = d.name || d.address;
      setConnected(true, devName); note('');
    }, function (err) {
      var was = connected;
      setConnected(false); devAddr = null;
      note(was ? 'Bağlantı kəsildi' : 'Qoşulmaq alınmadı. Robotun işə düşdüyünü və cütləşdiyini yoxlayın. ' + (err || ''));
    });
  }

  function connect() {
    if (!BT) { note('Bluetooth plugin tapılmadı. Tətbiq düzgün qurulmayıb.'); return; }
    askPermissions(function () {
      ensureEnabled(function () {
        BT.list(function (devices) {
          if (!devices || !devices.length) { note('Cütləşdirilmiş cihaz yoxdur. Telefon ayarlarında HC-05 ilə cütləşin (PIN 1234 / 0000).'); return; }
          var hc = devices.filter(function (d) { return /hc-?0[56]/i.test(d.name || ''); });
          if (hc.length === 1) doConnect(hc[0]); else showPicker(devices, doConnect);
        }, function (e) { note('Cihaz siyahısı alınmadı. Bluetooth icazəsini yoxlayın. ' + (e || '')); });
      }, note);
    });
  }

  function disconnect() {
    if (BT && devAddr) BT.disconnect(devAddr, SPP, function () {}, function () {});
    setConnected(false); devAddr = null;
  }

  connBtn.addEventListener('click', function () { connected ? disconnect() : connect(); });

  function send(c) {
    lastCmd.textContent = NAMES[c] + ' (' + c + ')';
    if (!connected || !BT) { note('Əvvəlcə Bluetooth-a qoşulun'); return; }
    BT.write(devAddr, SPP, c, function () {}, function () { note('Göndərmə xətası'); });
  }

  // ---------- Manual buttons (hold to move, release to stop) ----------
  document.querySelectorAll('.pad button').forEach(function (btn) {
    var c = btn.dataset.c;
    function down(e) { e.preventDefault(); btn.classList.add('active'); send(c); if (navigator.vibrate) navigator.vibrate(15); }
    function up(e) { e.preventDefault(); if (btn.classList.contains('active')) { btn.classList.remove('active'); if (c !== 'S') send('S'); } }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // ---------- Voice ----------
  var voiceOn = false, LANG = 'az-AZ', errCount = 0;

  function norm(s) {
    return s.toLocaleLowerCase('az')
      .replace(/ə/g,'e').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ü/g,'u')
      .replace(/ğ/g,'g').replace(/ş/g,'s').replace(/ç/g,'c').replace(/[^a-z\s]/g,' ');
  }
  // Yerli (offline ehtiyat) qaydalar. Geri əmri üçün tez-tez yanlış eşidilən variantlar da əlavə olunub.
  var RULES = [
    ['S', ['dayandir', 'dayan', 'dayanin', 'stop', 'sakit', 'bes']],
    ['F', ['ireli', 'irelle', 'qabaga', 'qabag', 'ileri']],
    ['B', ['geri', 'geriye', 'geride', 'gere', 'keri', 'gelir', 'gel', 'gele', 'geldi', 'gerisin', 'arxaya', 'arxa']],
    ['L', ['sola', 'sol']],
    ['R', ['saga', 'sag']]
  ];
  function parseVoice(text) {
    var words = norm(text).split(/\s+/).filter(Boolean);
    for (var i = words.length - 1; i >= 0; i--)
      for (var r = 0; r < RULES.length; r++)
        if (RULES[r][1].indexOf(words[i]) !== -1) return RULES[r][0];
    return null;
  }

  // ---------- Gemini ----------
  var DEFAULT_MODEL = 'gemini-2.5-flash-lite';
  var GEMINI_TIMEOUT = 5000;
  var cfg = { key: '', model: DEFAULT_MODEL, on: false };
  try {
    cfg.key = localStorage.getItem('gem_key') || '';
    cfg.model = localStorage.getItem('gem_model') || DEFAULT_MODEL;
    cfg.on = localStorage.getItem('gem_on') === '1';
  } catch (e) {}
  function geminiActive() { return cfg.on && !!cfg.key; }
  function updateAiState() {
    $('aiState').textContent = geminiActive() ? '🤖 Gemini: aktiv' : (cfg.on ? '🤖 Gemini: açar yoxdur' : '🤖 Gemini: söndürülüb');
  }

  var SYSTEM_PROMPT =
    'Sən Azərbaycan dilində səslə idarə olunan robot maşının əmr tərcüməçisisən. ' +
    'Sənə telefonun səs tanıma sisteminin eşitdiyi bir neçə mümkün mətn variantı verilir (ən ehtimallısı birincidir). ' +
    'Bu mətnlər tez-tez səhv eşidilir (fonetik oxşarlıq, Azərbaycan/Türk dili qarışıqlığı). ' +
    'Məqsəd: istifadəçinin həqiqətən nə demək istədiyini kontekstə görə təxmin edib, bu əmrlərdən YALNIZ BİRİNİ qaytarmaqdır:\n' +
    'F = irəli (irəli, ireli, qabağa, düz get, ileri, forward)\n' +
    'B = geri (geri, geri dön, geriyə, arxaya, geri get, gəlir, gəl, gel, gele, keri, gere, geride, back, reverse). ' +
    'Diqqət: robot üçün "gəl", "gəlir", "gel", "geri dön" kimi ifadələr səs tanımanın "geri" sözünü səhv eşitməsidir və B sayılır.\n' +
    'L = sola (sola, sol, sol tərəfə, sola dön, left)\n' +
    'S = dayan (dayan, dayandır, stop, sakit, bəs, saxla, kifayət)\n' +
    'R = sağa (sağa, sağ, sağ tərəfə, sağa dön, right)\n' +
    'NONE = heç bir əmrə uyğun gəlmir və ya tamamilə aydın deyil.\n' +
    'Qaydalar: yalnız JSON qaytar. Əmin deyilsənsə və variantlar arasında yalnız biri əmrə bənzəyirsə, onu seç. ' +
    'Əmr sözü olmayan söhbəti (məs: "salam necəsən") NONE say. Əgər həm "dayan", həm başqa əmr varsa, S seç.';

  function askGemini(matches) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, GEMINI_TIMEOUT);
    var list = matches.map(function (m, i) { return (i + 1) + '. ' + m; }).join('\n');
    var body = {
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts: [{ text: 'Eşidilən variantlar:\n' + list }] }],
      generationConfig: {
        temperature: 0,
        maxOutputTokens: 40,
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'OBJECT',
          properties: { command: { type: 'STRING', enum: ['F', 'B', 'L', 'R', 'S', 'NONE'] } },
          required: ['command']
        },
        thinkingConfig: { thinkingBudget: 0 }
      }
    };
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
              encodeURIComponent(cfg.model || DEFAULT_MODEL) + ':generateContent';
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ('HTTP ' + r.status));
        return j;
      });
    }).then(function (j) {
      clearTimeout(timer);
      var t = j && j.candidates && j.candidates[0] && j.candidates[0].content &&
              j.candidates[0].content.parts && j.candidates[0].content.parts[0] &&
              j.candidates[0].content.parts[0].text;
      if (!t) throw new Error('Boş cavab');
      var c = JSON.parse(t.replace(/```json|```/g, '').trim()).command;
      if (['F', 'B', 'L', 'R', 'S', 'NONE'].indexOf(c) === -1) throw new Error('Yanlış əmr: ' + c);
      return c;
    }, function (e) { clearTimeout(timer); throw e; });
  }

  var seq = 0, appliedSeq = 0;
  function handleMatches(matches) {
    if (!matches.length) return;
    var heard = matches[0];
    lastVoice.textContent = heard;

    // Təhlükəsizlik: "dayan" yerli olaraq dərhal icra olunur (Gemini-ni gözləmir)
    for (var i = 0; i < matches.length; i++) {
      if (parseVoice(matches[i]) === 'S') { appliedSeq = ++seq; send('S'); return; }
    }

    var mySeq = ++seq;
    function apply(cmd, how) {
      if (mySeq < appliedSeq) return;            // daha yeni əmr artıq icra olunub
      appliedSeq = mySeq;
      if (cmd && cmd !== 'NONE') { send(cmd); if (how) note(how); }
      else note('Əmr anlaşılmadı: ' + heard);
    }
    function local(msg) {
      var c = null;
      for (var k = 0; k < matches.length && !c; k++) c = parseVoice(matches[k]);
      apply(c, msg || '');
    }

    if (!geminiActive()) { local(''); return; }
    askGemini(matches).then(function (c) {
      apply(c, '');
    }, function (e) {
      local('Gemini xətası (yerli tanıma işlədi): ' + (e && e.name === 'AbortError' ? 'vaxt bitdi' : (e && e.message || e)));
    });
  }

  // ---------- Gemini ayarları ----------
  function openSettings() {
    $('keyInput').value = cfg.key; $('modelInput').value = cfg.model; $('aiOn').checked = cfg.on;
    $('settings').style.display = 'flex';
  }
  function readSettings() {
    cfg.key = $('keyInput').value.trim();
    cfg.model = $('modelInput').value.trim() || DEFAULT_MODEL;
    cfg.on = $('aiOn').checked;
  }
  $('setBtn').addEventListener('click', openSettings);
  $('aiClose').addEventListener('click', function () { $('settings').style.display = 'none'; });
  $('aiSave').addEventListener('click', function () {
    readSettings();
    try {
      localStorage.setItem('gem_key', cfg.key);
      localStorage.setItem('gem_model', cfg.model);
      localStorage.setItem('gem_on', cfg.on ? '1' : '0');
    } catch (e) {}
    updateAiState(); $('settings').style.display = 'none';
    note(geminiActive() ? 'Gemini aktivdir' : '');
  });
  $('aiTest').addEventListener('click', function () {
    readSettings();
    if (!cfg.key) { note('Əvvəlcə API açarını daxil edin'); return; }
    note('Gemini yoxlanılır...');
    askGemini(['gelir', 'gel', 'geri dön']).then(function (c) {
      note(c === 'B' ? '✅ Gemini işləyir ("gelir" → geri)' : 'Gemini cavab verdi, lakin gözlənilməz nəticə: ' + c);
    }, function (e) { note('❌ Gemini xətası: ' + (e && e.message || e)); });
  });
  updateAiState();

  function listenLoop() {
    if (!voiceOn) return;
    var sr = window.plugins && window.plugins.speechRecognition;
    if (!sr) { note('Səs tanıma plugin-i tapılmadı'); voiceOn = false; updateVoiceBtn(); return; }
    sr.startListening(function (matches) {
      errCount = 0;
      handleMatches(matches || []);
      setTimeout(listenLoop, 200);
    }, function (err) {
      errCount++;
      if (errCount >= 4 && LANG === 'az-AZ') {
        LANG = 'tr-TR'; errCount = 0;
        note('az-AZ dəstəklənmir, tr-TR ilə davam edir');
      }
      setTimeout(listenLoop, 500);
    }, { language: LANG, matches: 8, showPopup: false, showPartial: false });
  }

  function startVoice() {
    var sr = window.plugins && window.plugins.speechRecognition;
    if (!sr) { note('Səs tanıma plugin-i tapılmadı'); return; }
    sr.requestPermission(function () {
      voiceOn = true; errCount = 0; updateVoiceBtn(); note(''); listenLoop();
    }, function () { note('Mikrofon icazəsi verilməyib'); });
  }
  function stopVoice() {
    voiceOn = false; updateVoiceBtn();
    try { window.plugins.speechRecognition.stopListening(function () {}, function () {}); } catch (e) {}
  }
  function updateVoiceBtn() {
    voiceBtn.classList.toggle('on', voiceOn);
    voiceBtn.textContent = voiceOn ? '🎤 Səs idarəsi: Dinləyir...' : '🎤 Səs idarəsi: Söndürülüb';
  }
  voiceBtn.addEventListener('click', function () { voiceOn ? stopVoice() : startVoice(); });

  // ---------- Init ----------
  document.addEventListener('deviceready', function () {
    BT = window.bluetoothClassicSerial || null;
    if (!BT) note('Bluetooth plugin yüklənməyib');
    askPermissions(function () {});
  }, false);

  document.addEventListener('pause', function () { if (connected) send('S'); }, false);

  setTimeout(function () {
    if (!window.cordova) note('Bu fayl yalnız qurulmuş APK daxilində Bluetooth ilə işləyir.');
  }, 1500);
})();
</script>
</body>
</html>
