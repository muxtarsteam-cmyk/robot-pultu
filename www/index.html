<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Səs yoxlama</title>
<style>
  :root { --bg:#0d1b26; --panel:#15293a; --line:#24415a; --text:#e8f0f6; --muted:#8fa6b8; --cyan:#4cc9f0; --amber:#ffb703; --green:#5ee08a; --red:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .app { max-width:520px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  h1 { margin:0; font-size:19px; font-weight:650; }
  .sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--muted); }
  label.row { flex-direction:row; align-items:center; gap:8px; color:var(--text); font-size:13px; }
  input, select { font:inherit; font-size:14px; color:var(--text); background:#0d1b26; border:1px solid var(--line); border-radius:8px; padding:8px; width:100%; min-width:0; }
  input[type=checkbox] { width:auto; }
  button { font:inherit; font-size:14px; color:var(--text); background:#24415a; border:0; border-radius:9px; padding:9px 12px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
  #mic { width:100%; font-size:16px; padding:14px; font-weight:600; background:#1f6f8b; }
  #mic.on { background:#1f7a4d; }
  .state { display:flex; align-items:center; gap:10px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#456; flex:none; }
  .dot.sleep { background:#456; } .dot.listen { background:var(--cyan); } .dot.awake { background:var(--amber); } .dot.think { background:#b388ff; } .dot.say { background:var(--green); }
  #stateTxt { font-size:15px; font-weight:600; }
  #stateSub { font-size:12.5px; color:var(--muted); }
  .meter { height:6px; background:#0d1b26; border-radius:4px; overflow:hidden; margin-top:8px; }
  .meter i { display:block; height:100%; width:0; background:var(--cyan); transition:width .08s linear; }
  .lim { height:6px; background:#0d1b26; border-radius:4px; overflow:hidden; margin-top:4px; }
  .lim i { display:block; height:100%; width:0; background:var(--green); }
  .log { max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.35; margin-top:6px; }
  .log .l { padding:6px 8px; border-radius:8px; background:#0d1b26; }
  .log .t { color:var(--muted); font-size:11.5px; margin-right:6px; }
  .log .me { border-left:3px solid var(--cyan); } .log .bot { border-left:3px solid var(--green); } .log .heard { border-left:3px solid #456; color:#c3d2de; } .log .sys { color:var(--amber); font-size:12.5px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .head b { font-size:14px; }
  .head .btns { display:flex; gap:6px; }
  .head button { padding:5px 9px; font-size:12px; }
  #note { min-height:18px; font-size:12.5px; color:var(--amber); }
  #note.err { color:var(--red); }
  details summary { cursor:pointer; font-size:14px; font-weight:600; }
  details[open] summary { margin-bottom:8px; }
  @media (prefers-reduced-motion: reduce) { .meter i { transition:none; } }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>Səs yoxlama</h1>
    <div class="sub">Adı çağıranda cavab verir. Çağırmayanda eşitdiyini yazır.</div>
  </div>

  <div class="card state">
    <div class="dot sleep" id="dot"></div>
    <div style="flex:1;min-width:0">
      <div id="stateTxt">Mikrofon söndürülüb</div>
      <div id="stateSub">Başlamaq üçün düyməyə bas</div>
    </div>
  </div>

  <button id="mic">🎤 Dinləməyə başla</button>
  <div id="note"></div>
  <div class="meter" id="meterBox" style="display:none"><i id="meter"></i></div>

  <details class="card" id="setBox" open>
    <summary>Ayarlar</summary>
    <div class="grid">
      <label>Robotun adı<input id="name" type="text" placeholder="məs. Ziko" autocomplete="off"></label>
      <label>Gemini API açarı<input id="key" type="password" placeholder="AIza..." autocomplete="off"></label>
      <label>Dinləmə üsulu
        <select id="engine"><option value="gemini">Gemini (səsi özü yazır)</option><option value="browser">Brauzer tanıması</option></select>
      </label>
      <label>Gemini modeli<input id="model" type="text" placeholder="boş = avtomatik"></label>
      <label>Dəqiqədə limit<input id="rpm" type="number" min="1" max="1000"></label>
      <label>Gündə limit<input id="rpd" type="number" min="1" max="100000"></label>
      <label>Oyaq qalma (san)<input id="awake" type="number" min="3" max="60"></label>
      <label>Susma gözləmə (ms)<input id="pause" type="number" min="500" max="4000" step="100"></label>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      <label class="row"><input type="checkbox" id="speakOn"> Cavabı səslə oxu</label>
      <label class="row"><input type="checkbox" id="chatMode"> Cavabdan sonra bir az oyaq qal (adı təkrar demədən davam)</label>
      <label class="row"><input type="checkbox" id="ctxOn"> Çağırılmayan söhbətləri cavab üçün kontekst kimi istifadə et</label>
    </div>
  </details>

  <div class="card">
    <div class="sub" id="limTxt">Sorğu: 0</div>
    <div class="lim"><i id="limBar"></i></div>
  </div>

  <div class="card">
    <div class="head"><b>Söhbət</b><div class="btns"><button id="clrChat">Təmizlə</button></div></div>
    <div class="log" id="chat"></div>
  </div>

  <div class="card">
    <div class="head"><b>Eşidilənlər (çağırılmayanda)</b>
      <div class="btns"><button id="cpHeard">Kopyala</button><button id="dlHeard">Yüklə</button><button id="clrHeard">Təmizlə</button></div></div>
    <div class="log" id="heard"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function sget(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- ayarlar ----------
  var S = {
    name: sget('sy_name', ''), key: sget('sy_key', ''), engine: sget('sy_engine', ''), model: sget('sy_model', ''),
    rpm: +sget('sy_rpm', 10), rpd: +sget('sy_rpd', 250), awake: +sget('sy_awake', 10), pause: +sget('sy_pause', 1200),
    speakOn: sget('sy_speak', '1') === '1', chatMode: sget('sy_chat', '0') === '1', ctxOn: sget('sy_ctx', '1') === '1'
  };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!S.engine) S.engine = SR ? 'browser' : 'gemini';
  if (!SR) { var o = $('engine').querySelector('option[value=browser]'); if (o) o.disabled = true; if (S.engine === 'browser') S.engine = 'gemini'; }
  $('name').value = S.name; $('key').value = S.key; $('engine').value = S.engine; $('model').value = S.model;
  $('rpm').value = S.rpm; $('rpd').value = S.rpd; $('awake').value = S.awake; $('pause').value = S.pause;
  $('speakOn').checked = S.speakOn; $('chatMode').checked = S.chatMode; $('ctxOn').checked = S.ctxOn;

  function readSettings() {
    S.name = $('name').value.trim(); S.key = $('key').value.trim(); S.engine = $('engine').value; S.model = $('model').value.trim();
    S.rpm = Math.max(1, +$('rpm').value || 10); S.rpd = Math.max(1, +$('rpd').value || 250);
    S.awake = Math.min(60, Math.max(3, +$('awake').value || 10)); S.pause = Math.min(4000, Math.max(500, +$('pause').value || 1200));
    S.speakOn = $('speakOn').checked; S.chatMode = $('chatMode').checked; S.ctxOn = $('ctxOn').checked;
    sset('sy_name', S.name); sset('sy_key', S.key); sset('sy_engine', S.engine); sset('sy_model', S.model);
    sset('sy_rpm', S.rpm); sset('sy_rpd', S.rpd); sset('sy_awake', S.awake); sset('sy_pause', S.pause);
    sset('sy_speak', S.speakOn ? '1' : '0'); sset('sy_chat', S.chatMode ? '1' : '0'); sset('sy_ctx', S.ctxOn ? '1' : '0');
    nameCache = null; limUpdate();
  }
  ['name', 'key', 'model', 'rpm', 'rpd', 'awake', 'pause'].forEach(function (id) { $(id).addEventListener('change', readSettings); });
  ['engine', 'speakOn', 'chatMode', 'ctxOn'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      var was = running, eng = S.engine; readSettings();
      if (was && eng !== S.engine) { stopAll(); startAll(); }
    });
  });

  // ---------- mətn köməkçiləri ----------
  function norm(s) {
    return String(s || '').toLocaleLowerCase('az').replace(/ə/g, 'e').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ü/g, 'u')
      .replace(/ğ/g, 'g').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function lev(a, b) {
    var m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
    var pr = [], i, j; for (j = 0; j <= n; j++) pr[j] = j;
    for (i = 1; i <= m; i++) { var prev = pr[0]; pr[0] = i; for (j = 1; j <= n; j++) { var t = pr[j]; pr[j] = Math.min(pr[j] + 1, pr[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
    return pr[n];
  }
  var nameCache = null;
  function nm() { if (nameCache === null) nameCache = norm(S.name); return nameCache; }
  function isWakeToken(t) {                                          // ad və ya onun çox yaxın səhv eşidilməsi
    var rn = nm(); if (!rn || !t) return false;
    if (t === rn) return true;
    if (rn.length >= 4 && rn.length <= 5 && t.length === rn.length && t[0] === rn[0] && lev(t, rn) <= 1) return true;
    if (rn.length >= 6 && t.length >= 5 && lev(t, rn) <= 1) return true;
    return false;
  }
  function hasWake(text) {
    var rn = nm(), full = norm(text); if (!rn || !full) return false;
    if (rn.indexOf(' ') >= 0) return (' ' + full + ' ').indexOf(' ' + rn + ' ') >= 0;
    var t = full.split(' '), i;
    for (i = 0; i + 1 < t.length; i++) if (t[i].length <= 3 && t[i + 1].length <= 4 && (t[i] + t[i + 1]) === rn) return true;   // "zi ko"
    for (i = 0; i < t.length; i++) if (isWakeToken(t[i])) return true;
    return false;
  }
  function wakeInAlts(a) {                                           // ad 1-ci variantda ya da ən azı 2 variantda olmalıdır
    var c = 0, top = false, k;
    for (k = 0; k < a.length && k < 4; k++) if (hasWake(a[k])) { c++; if (k === 0) top = true; }
    return top || c >= 2;
  }
  function stripName(text) {
    var rn = nm(); if (!rn) return String(text || '').trim();
    if (rn.indexOf(' ') >= 0) return String(text || '').replace(new RegExp(S.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), ' ').replace(/\s+/g, ' ').trim();
    return String(text || '').split(/\s+/).filter(function (w) { return !isWakeToken(norm(w)); }).join(' ').replace(/^[,.\s]+|[,.\s]+$/g, '').trim();
  }
  var JUNK = /(altyaz|abun[əe] ol|izl[əe]diyin|thanks for watching|subtitle|subscribe|amara\.org|www\.|продолжение следует|субтитры|спасибо за просмотр|музыка)/i;
  function isJunk(t) {                                               // boş, durğu, "NONE", halüsinasiya, təkrar
    t = String(t == null ? '' : t).trim();
    if (t.length < 2) return true;
    if (/^[\s.,!?…\-–_*\[\]()]*$/.test(t)) return true;
    if (/^\W*(none|null|nan|undefined|silence|noise|music|musiqi)\W*$/i.test(t)) return true;
    if (JUNK.test(t)) return true;
    var w = norm(t).split(' ').filter(Boolean); if (!w.length) return true;
    if (w.length >= 4) { var u = {}, k = 0, j; for (j = 0; j < w.length; j++) if (!u[w[j]]) { u[w[j]] = 1; k++; } if (k <= Math.ceil(w.length / 4)) return true; }
    return false;
  }
  var lastSpokenNorm = '', lastSpeakEnd = 0;
  function isEcho(text) {                                            // robotun öz səsi mikrofona qayıdıbsa
    if (!lastSpokenNorm) return false;
    var since = isSpeaking ? 0 : Date.now() - lastSpeakEnd;
    var t = norm(text).split(' ').filter(Boolean); if (t.length < 2) return false;
    if (t.length === 2) return since < 2500 && lastSpokenNorm.indexOf(t.join(' ')) >= 0;
    var sp = {}, hit = 0; lastSpokenNorm.split(' ').forEach(function (w) { sp[w] = 1; });
    t.forEach(function (w) { if (sp[w]) hit++; });
    return since < 8000 && hit / t.length >= 0.8;
  }

  // ---------- loglar ----------
  function stamp() { var d = new Date(); function p(n) { return (n < 10 ? '0' : '') + n; } return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  var heardLines = [];
  function addLine(boxId, cls, text) {
    var box = $(boxId), el = document.createElement('div'), t = document.createElement('span');
    el.className = 'l ' + cls; t.className = 't'; t.textContent = stamp();
    el.appendChild(t); el.appendChild(document.createTextNode(text));
    box.appendChild(el);
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  function chatLog(cls, text) { addLine('chat', cls, text); }
  function heardLog(text) { heardLines.push(stamp() + '  ' + text); if (heardLines.length > 500) heardLines.shift(); addLine('heard', 'heard', text); }
  $('clrChat').addEventListener('click', function () { $('chat').innerHTML = ''; history = []; });
  $('clrHeard').addEventListener('click', function () { $('heard').innerHTML = ''; heardLines = []; overheard = []; });
  $('cpHeard').addEventListener('click', function () {
    var txt = heardLines.join('\n');
    try { navigator.clipboard.writeText(txt).then(function () { note('Kopyalandı'); }, function () { note('Kopyalamaq olmadı', true); }); } catch (e) { note('Kopyalamaq olmadı', true); }
  });
  $('dlHeard').addEventListener('click', function () {
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([heardLines.join('\n')], { type: 'text/plain;charset=utf-8' }));
      a.download = 'eşidilənlər.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { note('Yükləmək olmadı. «Kopyala» düyməsindən istifadə edin', true); }
  });
  var noteT = 0;
  function note(t, err) { var n = $('note'); n.textContent = t || ''; n.className = err ? 'err' : ''; clearTimeout(noteT); if (t && !err) noteT = setTimeout(function () { n.textContent = ''; }, 4000); }

  // ---------- limitlər ----------
  var hits = [], dayRec = { day: dayKey(), n: 0 }, pausedUntil = 0;
  try { var dr = JSON.parse(sget('sy_day', '')); if (dr && dr.day === dayKey()) dayRec = dr; } catch (e) {}
  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function limReason() {                                              // boş sətir = icazə var
    var now = Date.now();
    if (dayRec.day !== dayKey()) dayRec = { day: dayKey(), n: 0 };
    hits = hits.filter(function (t) { return now - t < 60000; });
    if (now < pausedUntil) return 'Gemini gözləmədədir (' + Math.ceil((pausedUntil - now) / 1000) + ' san)';
    if (hits.length >= S.rpm) return 'dəqiqəlik limit dolub (' + S.rpm + ')';
    if (dayRec.n >= S.rpd) return 'günlük limit dolub (' + S.rpd + ')';
    return '';
  }
  function recordCall() { hits.push(Date.now()); dayRec.n++; sset('sy_day', JSON.stringify(dayRec)); limUpdate(); }
  function limUpdate() {
    var now = Date.now(); hits = hits.filter(function (t) { return now - t < 60000; });
    $('limTxt').textContent = 'Sorğu: dəqiqədə ' + hits.length + '/' + S.rpm + ' · gündə ' + dayRec.n + '/' + S.rpd;
    var f = Math.max(hits.length / S.rpm, dayRec.n / S.rpd);
    var b = $('limBar'); b.style.width = Math.min(100, f * 100) + '%'; b.style.background = f >= 1 ? 'var(--red)' : f > 0.7 ? 'var(--amber)' : 'var(--green)';
  }
  setInterval(limUpdate, 1000);

  // ---------- Gemini ----------
  var MODELS = ['gemini-3.5-flash-lite', 'gemini-3.5-flash', 'gemini-flash-lite-latest', 'gemini-flash-latest', 'gemini-2.5-flash'];
  var goodModel = sget('sy_model_ok', '');
  async function gemini(parts, opts) {
    opts = opts || {};
    if (!S.key) throw new Error('Gemini API açarı yazılmayıb');
    var why = limReason(); if (why) throw new Error('Gemini sorğusu göndərilmədi: ' + why);
    var list = [], seen = {};
    [S.model, goodModel].concat(MODELS).forEach(function (m) { if (m && !seen[m]) { seen[m] = 1; list.push(m); } });
    var lastStatus = 0, noThink = false, noJson = false;
    for (var i = 0; i < list.length; i++) {
      var gc = { temperature: opts.temp == null ? 0.3 : opts.temp, maxOutputTokens: opts.maxTokens || 400 };
      if (!noThink) gc.thinkingConfig = { thinkingBudget: 0 };
      if (opts.json && !noJson) gc.responseMimeType = 'application/json';
      var body = { contents: [{ parts: parts }], generationConfig: gc };
      if (opts.system) body.systemInstruction = { parts: [{ text: opts.system }] };
      var ac = new AbortController(), tm = setTimeout(function () { ac.abort(); }, opts.timeout || 12000), r;
      recordCall();
      try {
        r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(list[i]) + ':generateContent?key=' + encodeURIComponent(S.key),
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ac.signal });
      } catch (e) {
        clearTimeout(tm);
        if (e && e.name === 'AbortError' && i < list.length - 1 && i < 1) continue;
        throw new Error(e && e.name === 'AbortError' ? 'Gemini gec cavab verdi' : 'Şəbəkə xətası. İnternet var?');
      }
      clearTimeout(tm);
      lastStatus = r.status;
      if (r.ok) {
        if (goodModel !== list[i]) { goodModel = list[i]; sset('sy_model_ok', goodModel); }
        var j = await r.json(), txt = '';
        try { (j.candidates[0].content.parts || []).forEach(function (p) { if (p.text) txt += p.text; }); } catch (e) {}
        return txt.trim();
      }
      if (r.status === 404 || r.status === 503) continue;
      if (r.status === 400 && !noThink) { noThink = true; i--; continue; }
      if (r.status === 400 && opts.json && !noJson) { noJson = true; i--; continue; }
      if (r.status === 429) {
        var bt = ''; try { bt = await r.text(); } catch (e) {}
        var rd = /"retryDelay"\s*:\s*"(\d+(?:\.\d+)?)s"/.exec(bt), w = rd ? Math.ceil(+rd[1]) : 60;
        pausedUntil = Date.now() + (/PerDay|per day|daily/i.test(bt) ? 3600000 : w * 1000 + 1000);
        throw new Error('Gemini limiti doldu, bir az gözləyin (429)');
      }
      throw new Error(r.status === 400 || r.status === 403 ? 'API açarı səhvdir və ya icazəsi yoxdur (' + r.status + ')' : 'Gemini xətası (' + r.status + ')');
    }
    throw new Error('Heç bir Gemini modeli cavab vermədi (' + lastStatus + ')');
  }
  function parseJSON(t) {
    if (!t) return null; t = String(t).replace(/```json|```/gi, '').trim();
    try { return JSON.parse(t); } catch (e) {}
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e2) {} }
    return null;
  }
  function persona() {
    return 'You are a small friendly voice assistant robot named "' + (S.name || 'robot') + '". Speak Azerbaijani (use the language the user used). ' +
      'Answer in one to three short sentences, plain text only: no markdown, no emoji, no lists. If you do not know, say so briefly.';
  }
  var history = [], overheard = [];
  function ctxText() {
    var s = '';
    if (history.length) s += 'Recent conversation:\n' + history.slice(-6).join('\n') + '\n';
    if (S.ctxOn && overheard.length) s += 'Things you recently overheard in the room (not addressed to you, use only if relevant):\n' + overheard.slice(-5).join('\n') + '\n';
    return s;
  }
  function remember(who, text) { history.push(who + ': ' + String(text).slice(0, 200)); if (history.length > 8) history.shift(); }

  // ---------- vəziyyət ----------
  var running = false, isSpeaking = false, busyUntil = 0, activeUntil = 0, busy = 0, afterSpeak = null;
  function micOpen() { return running && !isSpeaking && Date.now() >= busyUntil; }
  function setState(cls, txt, sub) {
    $('dot').className = 'dot ' + cls; $('stateTxt').textContent = txt; $('stateSub').textContent = sub || '';
  }
  function refreshState() {
    var now = Date.now();
    if (!running) return setState('sleep', 'Mikrofon söndürülüb', 'Başlamaq üçün düyməyə bas');
    if (isSpeaking) return setState('say', 'Danışıram...', '');
    if (busy > 0) return setState('think', 'Düşünürəm...', '');
    if (now < activeUntil) return setState('awake', 'Oyaqdır: de', Math.ceil((activeUntil - now) / 1000) + ' san gözləyir');
    if (!S.name) return setState('listen', 'Dinləyir', 'Robotun adı yazılmayıb: hamısı yalnız yazılır');
    setState('listen', 'Dinləyir', '«' + S.name + '» deyəndə cavab verir');
  }
  setInterval(refreshState, 400);

  // ---------- danışıq ----------
  var voices = [];
  function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
  if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
  function pickVoice() {
    var pref = ['az', 'tr'], i, j;
    for (j = 0; j < pref.length; j++) for (i = 0; i < voices.length; i++) if ((voices[i].lang || '').toLowerCase().indexOf(pref[j]) === 0) return voices[i];
    return null;
  }
  var speakToken = 0;
  function finishSpeak(token) {
    if (token !== speakToken || !isSpeaking) return;
    isSpeaking = false; lastSpeakEnd = Date.now(); busyUntil = Date.now() + 800;
    if (afterSpeak === 'ack' || (afterSpeak === 'chat' && S.chatMode)) activeUntil = Date.now() + S.awake * 1000;   // yalnız çağırışdan (və istəyə görə cavabdan) sonra
    afterSpeak = null;
  }
  function speak(text, after) {
    text = String(text || '').trim(); if (!text) return;
    var token = ++speakToken;
    lastSpokenNorm = norm(text).slice(-500);
    afterSpeak = after || null;
    isSpeaking = true; busyUntil = Date.now() + 60000;
    var guard = setTimeout(function () { try { speechSynthesis.cancel(); } catch (e) {} finishSpeak(token); }, 4000 + text.length * 110);   // heç vaxt ilişib qalmasın
    function done() { clearTimeout(guard); finishSpeak(token); }
    if (!S.speakOn || !('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { setTimeout(done, 200); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text), v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'az-AZ';
      u.rate = 0.95; u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } catch (e) { setTimeout(done, 300); }
  }

  // ---------- eşidilən mətnin işlənməsi ----------
  function notice(e) { note(e && e.message ? e.message : 'Xəta', true); chatLog('sys', e && e.message ? e.message : 'Xəta'); }

  async function answerText(userText) {                                // mətn -> Gemini cavabı
    busy++;
    try {
      var out = await gemini([{ text: ctxText() + 'User says: ' + userText }], { system: persona(), maxTokens: 300, temp: 0.5 });
      if (!out) { chatLog('sys', 'Gemini boş cavab verdi'); return; }
      chatLog('bot', out); remember('Robot', out); speak(out, 'chat');
    } catch (e) { notice(e); } finally { busy--; }
  }
  function ack() { chatLog('bot', 'Bəli, dinləyirəm.'); speak('Bəli, dinləyirəm.', 'ack'); }

  // mətn mühərriki (brauzer tanıması): alts = variantlar
  function onBrowserText(alts) {
    if (!micOpen()) return;
    alts = (alts || []).filter(function (t) { return !isJunk(t) && !isEcho(t); });
    if (!alts.length) return;
    var text = alts[0], called = S.name && wakeInAlts(alts), active = Date.now() < activeUntil;
    if (!called && !active) { heardLog(text); overheard.push(text); if (overheard.length > 10) overheard.shift(); return; }
    var rest = called ? stripName(text) : text;
    chatLog('me', text); remember('User', text);
    if (!rest || norm(rest).length < 2) { activeUntil = 0; ack(); return; }
    activeUntil = 0; answerText(rest);
  }

  // səs mühərriki (Gemini): bir sorğu = yazıya çevirmə + çağırılıb-çağırılmama + cavab
  async function onAudioUtterance(wav, meta) {
    var b64 = await blobToBase64(wav), active = Date.now() < activeUntil;
    var prompt = 'TASK:EARS\nYou are the ears of a small robot named "' + (S.name || 'robot') + '". The audio is ONE spoken utterance (Azerbaijani, sometimes Turkish, Russian or English). ' +
      'Reply ONLY JSON: {"heard":"exact transcript","called":true|false,"answer":null|"..."}\n' +
      '- If there is no clear human speech (silence, noise, music, hum, TV) reply {"heard":"","called":false,"answer":null}. NEVER invent words.\n' +
      '- "called" is true only if the robot name (or a very close sound-alike) is CLEARLY spoken.\n' +
      '- If called is true OR the session is active, and the user asks or says something to the robot, put a short spoken answer (max 2 sentences, plain text, same language as the user) in "answer". If only the name was said, answer is null. Otherwise answer is null.\n' +
      'Session active: ' + (active ? 'true' : 'false') + '.\n' + ctxText();
    var t = await gemini([{ text: prompt }, { inline_data: { mime_type: 'audio/wav', data: b64 } }], { json: true, maxTokens: 500, timeout: 12000, system: S.name ? persona() : undefined });
    var r = parseJSON(t);
    if (!r) return;
    var heard = String(r.heard || '').trim();
    if (isJunk(heard) || isEcho(heard)) return;
    var called = !!S.name && hasWake(heard);                               // yalnız Gemini-nin "called" cavabına inanma: ad mətndə də olmalıdır
    active = Date.now() < activeUntil;
    if (!called && !active) { heardLog(heard); overheard.push(heard); if (overheard.length > 10) overheard.shift(); return; }
    if (!called && active && meta && (meta.voicedMs < 350 || meta.snr < 3.5)) return;
    chatLog('me', heard); remember('User', heard);
    var ans = r.answer ? String(r.answer).trim() : '';
    if (ans && norm(heard).split(' ').filter(Boolean).length >= 1 && !(/^(null|none)$/i.test(ans))) { activeUntil = 0; chatLog('bot', ans); remember('Robot', ans); speak(ans, 'chat'); return; }
    var rest = called ? stripName(heard) : heard;
    if (!rest || norm(rest).length < 2) { activeUntil = 0; ack(); return; }
    activeUntil = 0; await answerText(rest);                                // Gemini cavab verməyib: mətnlə ikinci cəhd
  }

  // ---------- brauzer tanıması ----------
  var rec = null, srErr = 0;
  function startBrowser() {
    if (!SR) { note('Bu brauzerdə səs tanıma yoxdur. «Gemini» üsulunu seçin.', true); return false; }
    try {
      rec = new SR(); rec.lang = 'az-AZ'; rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 3;
      rec.onresult = function (e) {
        srErr = 0;
        for (var i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) {
          var alts = [], j; for (j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
          try { onBrowserText(alts); } catch (er) {}
        }
      };
      rec.onend = function () { if (running && S.engine === 'browser') setTimeout(function () { try { rec.start(); } catch (er) {} }, 300); };
      rec.onerror = function (e) {
        if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed')) { note('Mikrofon icazəsi verilməyib', true); stopAll(); return; }
        if (e && e.error === 'language-not-supported') { try { rec.lang = 'tr-TR'; } catch (er) {} }
        srErr++;
      };
      rec.start(); return true;
    } catch (e) { note('Səs tanıma başlamadı', true); return false; }
  }
  function stopBrowser() { try { if (rec) { rec.onend = null; rec.onresult = null; rec.stop(); } } catch (e) {} rec = null; }

  // ---------- Gemini üçün mikrofon + nitq aşkarlama ----------
  var ctx = null, stream = null, srcNode = null, proc = null;
  var speaking = false, speech = [], preRoll = [], silenceMs = 0, speechMs = 0, noise = 0.008, onsetN = 0, voicedMs = 0, peakRms = 0, curRate = 16000, lastChunkAt = 0;
  var routing = false, pending = null;
  function downsample(buf, inRate, outRate) {
    if (inRate === outRate) return buf;
    var ratio = inRate / outRate, len = Math.floor(buf.length / ratio), out = new Float32Array(len);
    for (var i = 0; i < len; i++) { var pos = i * ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, buf.length - 1), f = pos - i0; out[i] = buf[i0] * (1 - f) + buf[i1] * f; }
    return out;
  }
  function concat(chunks) {
    var n = 0, i; for (i = 0; i < chunks.length; i++) n += chunks[i].length;
    var out = new Float32Array(n), o = 0; for (i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
    return out;
  }
  function toWav(samples, rate) {
    var buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (var i = 0; i < samples.length; i++) { var s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
    return new Blob([buf], { type: 'audio/wav' });
  }
  function blobToBase64(blob) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
  }
  function resetVad() { speaking = false; speech = []; preRoll = []; onsetN = 0; voicedMs = 0; peakRms = 0; silenceMs = 0; speechMs = 0; }

  function handleUtterance(chunks, meta) {
    var pcm = downsample(concat(chunks), curRate, 16000);
    if (pcm.length < 16000 * 0.3) return;
    var e2 = 0, k; for (k = 0; k < pcm.length; k += 8) e2 += pcm[k] * pcm[k];
    if (Math.sqrt(e2 / (pcm.length / 8)) < 0.012) return;                  // demək olar ki, səssiz
    if (pcm.length > 16000 * 20) pcm = pcm.subarray(0, 16000 * 20);
    var wav = toWav(pcm, 16000);
    if (routing) { pending = { wav: wav, meta: meta, t: Date.now() }; return; }   // eyni anda bir sorğu; ən yenisi gözləyir
    runRoute(wav, meta);
  }
  function runRoute(wav, meta) {
    routing = true; busy++;
    onAudioUtterance(wav, meta).catch(notice).then(function () {
      busy--; routing = false;
      var p = pending; pending = null;
      if (p && Date.now() - p.t < 12000) runRoute(p.wav, p.meta);
    });
  }
  function finishUtterance() {
    var s = speech, meta = { voicedMs: voicedMs, snr: noise > 0 ? peakRms / noise : 99 }, dens = speechMs ? voicedMs / speechMs : 0;
    speaking = false; speech = []; silenceMs = 0; onsetN = 0;
    if (!s.length) return;
    if (meta.voicedMs < 280 || dens < 0.18 || meta.snr < 3) return;        // nitq deyil: tıqqıltı, küy, nəfəs
    handleUtterance(s, meta);
  }
  function processChunk(chunk, rate) {
    if (!running) return;
    if (!micOpen()) { if (speaking || speech.length || preRoll.length) resetVad(); return; }   // robot danışarkən heç nə qəbul edilmir
    curRate = rate;
    var n = chunk.length, sum = 0, zc = 0, sgn = 0, i, x, s2;
    for (i = 0; i < n; i++) { x = chunk[i]; sum += x * x; s2 = x > 0.002 ? 1 : x < -0.002 ? -1 : 0; if (s2 !== 0) { if (sgn !== 0 && s2 !== sgn) zc++; sgn = s2; } }
    var rms = Math.sqrt(sum / n), ms = n / rate * 1000, crHz = zc * rate / (2 * n);
    var floor = Math.max(0.018, noise * 4);
    var voiced = rms > floor && crHz > 70 && crHz < 6500;                  // insan nitqi diapazonu
    $('meter').style.width = Math.min(100, rms / 0.15 * 100) + '%';
    if (!speaking) {
      noise = rms < noise ? noise * 0.9 + rms * 0.1 : noise * 0.995 + Math.min(rms, floor) * 0.005;
      noise = Math.min(0.05, Math.max(0.0015, noise));
      preRoll.push(chunk); if (preRoll.length > 10) preRoll.shift();
      if (voiced) onsetN++; else if (onsetN > 0) onsetN--;
      if (onsetN >= 3) { speaking = true; speech = preRoll.slice(); preRoll = []; silenceMs = 0; speechMs = 0; voicedMs = 0; peakRms = rms; onsetN = 0; }   // 3 nitq kadrı: tək tıqqıltı başlanğıc deyil
    } else {
      speech.push(chunk); speechMs += ms;
      if (voiced) { voicedMs += ms; if (rms > peakRms) peakRms = rms; }
      if (rms > floor * 0.7) silenceMs = 0; else silenceMs += ms;
      if (speechMs > 6000 && voicedMs / speechMs < 0.12) { resetVad(); return; }   // fasiləsiz küy
      var hang = speechMs < 1500 ? Math.min(S.pause, 450) : speechMs < 3500 ? Math.min(S.pause, 800) : S.pause;
      if (silenceMs > hang || speechMs > 20000) finishUtterance();
    }
  }
  var micStarting = false, micFails = 0;
  function startMic(isRestart) {
    if (micStarting) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { note('Bu mühitdə mikrofon dəstəklənmir', true); stopAll(); return; }
    micStarting = true;
    var tries = 0, CONS = [{ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false } }, { audio: true }];
    function attempt() {
      tries++;
      return navigator.mediaDevices.getUserMedia(CONS[(tries - 1) % CONS.length]).catch(function (e) { if (tries >= 4) throw e; return sleep(600).then(attempt); });
    }
    attempt().then(function (st) {
      micStarting = false;
      if (!running) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = st;
      var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
      try { ctx.resume(); } catch (e) {}
      srcNode = ctx.createMediaStreamSource(stream);
      proc = ctx.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = function (e) { lastChunkAt = Date.now(); processChunk(new Float32Array(e.inputBuffer.getChannelData(0)), ctx.sampleRate); };
      srcNode.connect(proc); proc.connect(ctx.destination);
      resetVad(); noise = 0.008; lastChunkAt = Date.now(); micFails = 0;
      if (isRestart) note('');
    }).catch(function (e) {
      micStarting = false;
      note('Mikrofon açılmadı: ' + (e && e.name ? e.name : e) + '. İcazəni yoxlayın.', true); stopAll();
    });
  }
  function stopMic() {
    try { if (proc) { proc.onaudioprocess = null; proc.disconnect(); } } catch (e) {}
    try { if (srcNode) srcNode.disconnect(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (ctx) ctx.close(); } catch (e) {}
    proc = srcNode = stream = ctx = null; resetVad(); $('meter').style.width = '0';
  }
  setInterval(function () {                                                // mikrofon donarsa özü yenidən açılır
    if (!running || S.engine !== 'gemini' || micStarting) return;
    if (!ctx) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    var tr = null; try { tr = stream.getAudioTracks()[0]; } catch (e) {}
    if (speaking && Date.now() - lastChunkAt > 1500) finishUtterance();
    if ((!tr || tr.readyState === 'ended' || Date.now() - lastChunkAt > 3000) && micFails < 5) {
      micFails++; note('Mikrofon yenidən açılır...'); stopMic(); setTimeout(function () { if (running && S.engine === 'gemini') startMic(true); }, 400);
    }
  }, 1000);

  // ---------- başlat / dayandır ----------
  function startAll() {
    readSettings();
    if (!S.key && !(S.engine === 'browser' && !S.name)) { note('Əvvəl Gemini API açarını yazın', true); $('setBox').open = true; return; }
    running = true; activeUntil = 0; busy = 0; routing = false; pending = null;
    $('mic').textContent = '⏹ Dinləməni dayandır'; $('mic').className = 'on';
    $('meterBox').style.display = S.engine === 'gemini' ? 'block' : 'none';
    if ('speechSynthesis' in window) { try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }   // səs sintezini oyat
    if (S.engine === 'browser') { if (!startBrowser()) { stopAll(); return; } } else startMic(false);
    if (!S.name) chatLog('sys', 'Robotun adı yazılmayıb: eşitdiyim hər şey yalnız yazılır.');
  }
  function stopAll() {
    running = false; try { speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false; stopBrowser(); stopMic();
    $('mic').textContent = '🎤 Dinləməyə başla'; $('mic').className = ''; $('meterBox').style.display = 'none'; refreshState();
  }
  $('mic').addEventListener('click', function () { if (running) stopAll(); else startAll(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && running && S.engine === 'gemini') { /* mikrofon arxa planda dayana bilər: nəzarətçi özü bərpa edir */ } });
  limUpdate(); refreshState();
})();
</script>
</body>
</html>
